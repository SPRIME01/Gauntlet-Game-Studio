id: req-gauntlet-m4a1-001
project_id: codename-gauntlet-warfare
capability_id: asset.reconstruct.reference-image
intent: Reconstruct the depicted M4A1 carbine as a procedural first-person viewmodel with muzzle, optic and ejection sockets.
acceptance:
  - Measured silhouette similarity at least 0.70 and no missing identity-defining part.
  - At most 12000 triangles and one standard Three.js dependency.
  - Named sockets socket-muzzle, socket-optic, socket-ejection.
  - External reference pixels remain reference-only, never shipped production textures.
inputs:
  target_role: weapon
  module_output_path: src/assets/m4a1-viewmodel.ts
  min_reference_similarity: 0.70
  budget_limits: { max_triangles: 12000 }
  references:
    - id: m4a1-profile
      path: references/m4a1-profile.png
      provenance_class: reference-only-external
      license: user-authorized-reference-only
preferred_provider: agent-skill.img2threejs
reference_ids: [m4a1-profile]
