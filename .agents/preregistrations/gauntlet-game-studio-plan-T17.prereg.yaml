falsifiers:
  - id: TEETH-T17-001
    attack: Start browser audio without a user gesture.
    expected: >-
      Audio remains explicitly locked/suspended without crashing unrelated game logic.
      The browser proof (Playwright + real system Chrome, no autoplay-policy bypass flags)
      must observe the backend in locked/suspended state after an un-gestured unlock attempt,
      with the surrounding simulation continuing to tick; only after a real trusted user
      gesture (click) does the backend reach ready.
  - id: TEETH-T17-002
    attack: Run headless server/tests with no DOM or AudioContext.
    expected: >-
      Simulation passes using the non-browser audio backend/no-op behavior. A full headless
      simulation (Koota authority + scheduler + readiness barrier) runs green under Bun with
      NullAudioBackend, zero DOM, zero AudioContext, and zero Tone.js dependencies, and a
      source-boundary scan proves packages/runtime never imports Tone.js or instantiates
      AudioContext.

independent_confirmation:
  required: true
  mode: independent_adversarial
  focus: >-
    Real gesture-policy conformance of the browser audio lifecycle (locked/suspended without
    gesture, ready only after a trusted gesture, no bypass flags), headless independence from
    DOM/AudioContext/Tone.js, AudioBackend boundary discipline (no Tone/AudioContext objects in
    game semantics), quarks VFX as an inspectable execution projection that cannot mutate
    authoritative state, and headless-safe DOM/CSS HUD conventions.
  known_confounds:
    - Stale evidence or a different project revision.
    - Unavailable optional provider/tool being mistaken for core capability failure
      (e.g. missing system Chrome would block only the browser-proof leg, not the
      audio boundary or headless legs).
