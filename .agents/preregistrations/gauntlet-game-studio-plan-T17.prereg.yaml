claims:
  - id: CLAIM-T17-001
    statement: >-
      VFX/audio/UI can participate in gameplay consequences while audio unlock follows real
      browser gesture policy and headless simulation remains independent of AudioContext.
      three.quarks is integrated as the preferred VFX binding strictly behind a game/runtime
      effect projection (an inspectable execution projection that never owns gameplay semantics
      and never back-propagates into authoritative state). The studio-owned AudioBackend
      abstraction (state: locked | suspended | ready; explicit is_headless) is defined in
      packages/runtime/src/audio; core semantic systems and headless server code interact with
      audio only through this abstraction and pure data intents. NullAudioBackend is the
      mandatory backend for headless/server/pure tests and contains zero Web Audio or Tone.js
      imports; importing core game logic never requires window.AudioContext. The Tone.js browser
      backend in packages/adapters/src/audio/tone implements the same abstraction with an
      explicit locked/suspended -> real user gesture -> ready lifecycle and never bypasses
      autoplay policy. Unavailable or still-locked audio degrades only audio-dependent behavior
      and never crashes headless simulation or unrelated game logic. DOM/CSS HUD conventions are
      headless-safe: the HUD state model is pure data and no DOM is required in any server path.

