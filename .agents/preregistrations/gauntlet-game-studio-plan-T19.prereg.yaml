schema: agent.preregistration
schema_version: "1.0"
task_id: T19
title: Implement development/test observability bridge and network/runtime diagnostics
proof_level: P3
timestamp: "2026-09-15T12:00:00Z"
status: frozen

claims:
  - id: CLAIM-T19-001
    statement: >-
      Verification tooling can observe the runtime through semantic/runtime contracts rather than
      transient DOM/provider internals, and production does not accidentally expose privileged debug
      mutation. The stable, explicitly versioned observability contract is `__GAUNTLET_STUDIO_OBS__`
      (contract version 1), mounted by the runtime on its browser global target as
      `window.__GAUNTLET_STUDIO_OBS__` (REQ-OBS-001 explicitly-versioned equivalent of
      `window.__GAME_STUDIO__`); every surface declares
      `{ name: "__GAUNTLET_STUDIO_OBS__", version: 1, mode }`. On development/test mode the surface
      exposes readiness state plus per-subsystem states, deterministic simulation control
      (pause/resume, bounded fixed-step), seed and controlled scenario reset hooks, named camera/view
      access, semantic entity/state READS backed by Koota stable methods (never DOM selectors or
      provider-internal object names), a bounded error log buffer, a renderer capability/identity
      probe with stats and capture-only preserveDrawingBuffer configuration, physics/navigation
      inspection reads when those subsystems are present, and read-only network diagnostics
      (connection state, transport characteristics, RTT/latency, counters) reusing the T12
      network diagnostics contracts. All controlled scenario mutations are namespaced under a single
      clearly separated privileged `control` namespace that is absent in production mode. Production
      mode installs NO privileged mutation hooks (read-only surface only). Koota remains the sole
      semantic authority; the observability bridge is a read/projection and controlled-invocation
      layer and never a second semantic authority.
    settles:
      - REQ-OUT-004
      - REQ-OBS-001
      - REQ-OBS-002
      - REQ-OBS-003
      - REQ-OBS-004
      - REQ-OBS-005
      - REQ-SEC-005

falsifiers:
  - id: TEETH-T19-001
    attack: Use a transient DOM selector/provider object name as the only way to read semantic state.
    expected: Contract test fails because the stable observability method is missing.
  - id: TEETH-T19-002
    attack: Inspect a production bundle for privileged scenario/state mutation APIs.
    expected: Build check fails if such APIs are exposed.

independent_confirmation:
  required: true
  mode: independent_adversarial
  focus: >-
    Stable versioned observability contract (`__GAUNTLET_STUDIO_OBS__` v1) readable via Koota-backed
    stable methods with failure when only DOM/provider internals exist (TEETH-T19-001); production
    surface carrying no privileged pause/resume/step/reset/seed/scenario mutation and the production
    check demonstrably failing when such APIs are simulated (TEETH-T19-002); readiness, deterministic
    control, views, errors, renderer probe/capture config, physics/nav reads, and read-only network
    diagnostics all present on the dev/test surface; no new dependencies; Koota authority untouched.
