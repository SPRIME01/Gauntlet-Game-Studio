claims:
  - id: CLAIM-T07-001
    statement: >-
      Gauntlet Runtime owns runtime coordination independently of donor code and prevents
      duplicate Three.js instances, asynchronous subsystem races, duplicate physics stepping,
      and browser globals on the headless server. Lifecycle transitions through created,
      booting, ready, and failed; authoritative simulation scheduler is singular and separate
      from render cadence; headless server runs with zero DOM/canvas dependencies.
