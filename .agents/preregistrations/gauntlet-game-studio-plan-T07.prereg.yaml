falsifiers:
  - id: TEETH-T07-001
    attack: Delay or fail asynchronous subsystem initialization (e.g. physics/navigation) and request scenario start.
    expected: Runtime remains in booting or transitions to failed; execution barriers block premature start and prevent races.
  - id: TEETH-T07-002
    attack: Attempt to register a second authoritative simulation scheduler or step physics twice in a single tick.
    expected: Runtime rejects duplicate scheduler registration and prevents multiple stepping with typed invariant errors.
  - id: TEETH-T07-003
    attack: Import DOM/canvas/WebAudio primitives or globals into the headless server entrypoint.
    expected: Headless compatibility verification detects and fails immediately on DOM/canvas/audio leakage.

independent_confirmation:
