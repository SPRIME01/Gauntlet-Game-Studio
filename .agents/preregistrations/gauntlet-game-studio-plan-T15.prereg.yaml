    attack: Ask to reconstruct one specific depicted transceiver through the world-composition route.
    expected: Routing rejects/redirects to reference reconstruction.
  - id: TEETH-T15-002
    attack: Let 3dviz-created terrain mesh bypass TerrainHeightfield for physics/navigation.
    expected: Integration gate rejects the competing terrain authority.

