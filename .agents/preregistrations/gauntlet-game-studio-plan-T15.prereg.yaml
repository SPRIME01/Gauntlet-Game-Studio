claims:
  - id: CLAIM-T15-001
    statement: >-
      Environment intent can be authored through 3dviz without making it responsible for terrain
      authority, navigation authority, or specific-object reconstruction. The `world.environment.compose`
      studio capability routes scene/world composition (architecture, vegetation, lighting, atmosphere)
      to the pinned 3dviz agent skill as an AgentHandoff; handoff outputs (world kits, sockets, colliders,
      scatter metadata) normalize deterministically into project/runtime forms that compose WITH the
      canonical TerrainHeightfield (world.terrain) and runtime Recast navigation (world.navigation),
      never replacing them. Verification is deterministic with no model credentials and rejects
      composition outputs that claim terrain elevation or navmesh authority or that route specific
      depicted-object reconstruction through world composition (that intent belongs to the
      reference-reconstruction capability). The studio director owns routing; 3dviz/agent output is
      never authority over terrain, navigation, or the runtime.
    settles:
      - REQ-BIND-005

falsifiers:
