schema: agent.spec
schema_version: "1.0"

metadata:
  id: "agentic-threejs-game-studio"
  title: "Agentic Three.js Game Studio Normative Specification"
  status: "draft"
  version: "0.1.0"
  created: "2026-09-15"
  scope: >-
    Agentic development studio for polished browser-native 3D games built on a
    Three.js-compatible runtime, with capability-routed content production,
    evidence-driven verification, and Gauntlet settlement.
  purpose: >-
    Define the stable contracts by which agents turn a game specification and
    user-supplied references into a runnable, observable, verifiable browser
    game while keeping specialized upstream tools replaceable and narrowly
    scoped.
  owner: "Game Studio project"

  normative_language: "RFC 2119"
  normative_keywords:
    - MUST
    - MUST_NOT
    - REQUIRED
    - SHOULD
    - SHOULD_NOT
    - RECOMMENDED
    - MAY
    - OPTIONAL
  implementation_defined_meaning: >-
    Behavior is part of the implementation contract but this specification does
    not prescribe one universal mechanism. The implementation MUST document the
    selected behavior and prove conformance to the surrounding requirements.

sources:
  primary_brief:
    role: "Normative design intent captured by this specification."
    expected_path: "specs/game-studio.spec.yaml"

  specification_template:
    role: >-
      Structural authoring template only; it defines how the normative contract
      is expressed, not the Game Studio's product behavior.
    path: "AGENT_SPEC_TEMPLATE.yaml"

  current_upstream_capabilities:
    role: >-
      Evidence and implementation context for current preferred providers.
      Provider documentation does not override this specification.
    path: "Pinned upstream repositories, package manifests, and provider documentation."

  existing_implementation:
    role: >-
      Initially absent. Once implementation exists, it is evidence of current
      state and is not automatically the normative target.
    location: "implementation-defined"

spec_frame:
  quality_gate_questions:
    - "What should be built?"
    - "What result should it produce?"
    - "How will we know the result is real?"
    - "What capability should become reliably available after repeated successful use?"
    - "What evidence proves the capability claim?"
    - "What fails safely?"
    - "What must repeat until reliable?"
    - "What changes when evidence disagrees with the design?"

  proof_loop:
    mermaid: |-
      flowchart LR
        Intent["Game requirement / frozen expectation"] --> Route["Capability routing"]
        Route --> Build["Specialist implementation"]
        Build --> Run["Runnable game consequence"]
        Run --> Observe["Observe: state + pixels + telemetry"]
        Observe --> Verify["Gauntlet verification"]
        Verify -->|passes| Confirm["Independent/fresh confirmation when required"]
        Confirm --> Settle["Settled capability"]
        Verify -->|mismatch| Classify["Classify blockage"]
        Classify --> Correct["Bounded correction or representation change"]
        Correct --> Run
        Observe --> Evidence["Immutable run evidence"]
        Evidence --> Settle
        Evidence -->|contradicts design| Revise["Revise spec or implementation"]

problem_statement:
  system_name: "Agentic Three.js Game Studio"

  problem_summary: >-
    Browser-game development by coding agents becomes unreliable when world
    generation, reference reconstruction, runtime systems, art production,
    testing, and optimization are exposed as unrelated tools. Agents either
    choose the wrong representation, load excessive tool context, overuse
    heavyweight tools such as Blender or generative APIs, or declare completion
    from code existence or screenshots without proving gameplay, visual, and
    runtime consequences.

  job_to_be_done:
    actor: "A user or coding agent specifying a browser game or game increment."
    trigger: >-
      A game, level, mechanic, asset, visual effect, or production-quality
      improvement must be created or changed.
    job: >-
      Route the requirement to the smallest appropriate set of specialist
      capabilities, produce an integrated runnable result, and verify the result
      against frozen expectations through reproducible evidence.
    outcome: >-
      A polished browser-native game increment exists as an independently
      buildable project, behaves as specified, meets declared visual and runtime
      budgets, preserves provenance, and is settled by evidence rather than by
      agent assertion.

  current_failure_modes:
    - >-
      Agents conflate a rendered scene with authoritative game state and cannot
      reliably determine whether gameplay semantics actually changed.
    - >-
      Agents overuse a familiar provider or DCC tool instead of selecting the
      representation best suited to the requirement.
    - >-
      Screenshot-only verification produces false success when the scene looks
      plausible but navigation, physics, state, performance, or interaction is wrong.
    - >-
      Upstream tools are tightly coupled or forked unnecessarily, making upgrades
      expensive and obscuring ownership boundaries.
    - >-
      Asset provenance, licensing, compression, collision, LOD, and runtime
      budgets are treated as cleanup rather than part of asset acceptance.
    - >-
      Large skill descriptions and indiscriminate skill loading increase routing
      ambiguity and consume agent context before a tool is selected.

  why_existing_approaches_fail: >-
    Conventional game engines centralize many concerns inside one editor and
    scene graph, while agent-first workflows require narrow machine-readable
    affordances, deterministic automation, inspectable source representations,
    explicit provenance, and evidence-producing interfaces. A collection of
    powerful tools does not provide those semantics by itself.

  important_boundary:
    is: >-
      A capability-routed, adapter-mediated, evidence-driven studio for creating
      browser-native Three.js games and their supporting assets, scenes, runtime
      systems, and verification evidence.
    is_not: >-
      A replacement for Three.js, Needle, Blender, 3dviz-pro-max, img2threejs,
      threejs-game-skills, or other specialist providers; a Unity pipeline; or
      a monolithic DCC/game engine whose scene file is the source of truth.
    successful_execution: >-
      The requested capability is implemented in the game, observed through the
      required channels, meets the relevant acceptance and budget gates, and has
      fresh evidence sufficient for the declared confirmation mode.
    false_success_boundary: >-
      Generated files, a green build, an attractive screenshot, a provider
      reporting success, or a playable-looking scene MUST NOT alone be called a
      verified game outcome.

requirements:
  goals:
    - id: REQ-GOAL-001
      text: >-
        The studio MUST route each substantial requirement through an explicit
        capability abstraction before selecting a provider or specialist skill.
    - id: REQ-GOAL-002
      text: >-
        The studio MUST preserve a Three.js-compatible runtime boundary so
        generated scene and asset representations can integrate without
        unnecessary format translation.
    - id: REQ-GOAL-003
      text: >-
        The studio MUST separate authoritative game semantics from render-scene,
        physics, navigation, DCC, and asset-production representations.
    - id: REQ-GOAL-004
      text: >-
        The studio MUST verify settlement-critical work through state, pixels,
        and telemetry whenever all three are material to the requirement.
    - id: REQ-GOAL-005
      text: >-
        The studio MUST prefer inspectable, agent-editable, licensed or
        user-provided representations before escalating to opaque or
        heavyweight generation routes.
    - id: REQ-GOAL-006
      text: >-
        The studio MUST make upstream providers replaceable behind stable
        contracts and SHOULD avoid source forks unless an affordance cannot be
        supplied through an adapter, overlay, patch, or configuration.
    - id: REQ-GOAL-007
      text: >-
        The studio MUST produce projects that remain independently buildable
        from the studio repository after creation.

  non_goals:
    - id: NONGOAL-001
      text: "Make Unity a supported runtime or authoring target."
    - id: NONGOAL-002
      text: >-
        Reimplement specialist systems already supplied adequately by maintained
        upstream libraries or skills.
    - id: NONGOAL-003
      text: >-
        Make Blender the normal authoring environment or authoritative game
        representation.
    - id: NONGOAL-004
      text: >-
        Require all content to be AI-generated when reusable licensed,
        procedural, or user-provided content is more appropriate.
    - id: NONGOAL-005
      text: >-
        Define one universal triangle, draw-call, or frame-time budget for every
        game; game-specific quality profiles own those targets.
    - id: NONGOAL-006
      text: >-
        Claim film, console, or desktop-native AAA parity beyond what the target
        browser, hardware, and project-specific budgets can support.

outcome_contract:
  output_produced:
    primary_output: >-
      An independently buildable browser-game project or verified increment that
      conforms to the studio contracts and includes the evidence required to
      support its current settlement state.

    requirements:
      - id: REQ-OUT-001
        text: >-
          Every created game project MUST carry a project-local game
          specification, studio lock manifest, runtime source, tests, asset
          registry, and evidence location.
      - id: REQ-OUT-002
        text: >-
          Every external or generated game asset MUST have an AssetRecord before
          it can be considered accepted for production use.
      - id: REQ-OUT-003
        text: >-
          Every settlement-critical studio run MUST emit an EvidenceManifest
          tied to a run ID, project revision, scenario, seed where relevant, and
          observed artifacts.
      - id: REQ-OUT-004
        text: >-
          Development and test builds MUST expose the studio observability
          contract; production builds MUST NOT expose privileged debug mutation
          controls unless the game explicitly requires them.
      - id: REQ-OUT-005
        text: >-
          Provider-specific output MUST be normalized into studio contracts
          before downstream systems rely on it.

  outcome_verified:
    condition: >-
      The game or increment satisfies its frozen acceptance criteria, required
      runtime budgets, asset/provenance constraints, and required observation
      channels in a fresh run on the declared target environment.

    signals:
      - id: REQ-VERIFY-001
        text: >-
          Settlement-critical behavioral claims MUST be corroborated by
          authoritative semantic state or a deterministic external oracle, not
          inferred solely from screenshots.
      - id: REQ-VERIFY-002
        text: >-
          Settlement-critical visual claims MUST be supported by fresh rendered
          captures from named scenarios/views and MUST NOT be inferred solely
          from scene structure.
      - id: REQ-VERIFY-003
        text: >-
          Settlement-critical performance claims MUST be supported by measured
          telemetry under a declared browser, viewport, quality profile, and
          scenario.
      - id: REQ-VERIFY-004
        text: >-
          High-risk capability groups MUST receive the confirmation mode
          declared in conformance_traceability after the primary implementation
          run passes.
      - id: REQ-VERIFY-005
        text: >-
          A provider, skill, or build command reporting success MUST NOT be
          treated as proof that the resulting game capability is correct.

    false_completion_conditions:
      - "The project builds but the primary gameplay path was not exercised."
      - "A screenshot looks correct but authoritative state, navigation, physics, or telemetry contradicts it."
      - "The provider returned an asset but provenance, import, runtime budget, or required affordances are unverified."
      - "A test was skipped because a required browser, provider, or integration was unavailable."
      - "Only historical evidence from a prior run exists."
      - "The requested route silently degraded to another provider or representation."

  consumer_and_handoff:
    consumers:
      - "The game project's coding agents."
      - "The user reviewing, running, or extending the game."
      - "The Gauntlet verification loop."
      - "CI/release qualification."

    handoff_complete_when:
      - "The game repository builds independently using its pinned dependencies."
      - "The studio lock manifest identifies the studio and capability revisions used."
      - "Required assets have accepted AssetRecords and no unresolved blocking provenance state."
      - "The observability and proof interfaces required by the game specification are reproducible."
      - "Open assumptions, degraded routes, and unsettled requirements are explicitly surfaced."

    unverified_state: "incomplete"
    unverified_surface:
      - "Studio CLI structured result."
      - "Project current status / Gauntlet state."
      - "EvidenceManifest and validation report."

capability_claim:
  applicability: "operational_reliability_only"
  owner: "The user and coding agents operating the Game Studio."

  delta: >-
    A cold agent can more reliably turn game intent and references into integrated,
    browser-native game capabilities by selecting the correct representation and
    specialist provider, while preserving provenance and producing evidence that
    makes completion claims reviewable.

  why_in_scope: >-
    The studio exists specifically to reduce routing ambiguity, representation
    errors, hidden fallbacks, and false completion across repeated game-development
    work.

  proven_only_if:
    - "Multiple materially different game capabilities route correctly without manual provider selection."
    - "Reference-image, world-building, runtime, asset-sourcing, Blender-escalation, and verification routes all complete through their declared contracts."
    - "The same game project can be verified from a fresh checkout using its lock and proof interfaces."
    - "Provider unavailability and incorrect routing produce bounded, observable failure or documented fallback rather than silent degradation."

  not_proven_by:
    - "One impressive game demo."
    - "A large number of integrated libraries."
    - "Skill installation alone."
    - "A green unit-test suite without real browser integration."
    - "An agent claiming that the workflow felt easier."

  learning_claim: >-
    Repetition may establish operational reliability and may produce reusable
    evidence or better routing configuration. It does not by itself prove that
    the studio or its models autonomously learned.

claim_discipline:
  levels:
    evidence_backed: >-
      Supported by implementation, tests, logs, proof commands, reviewable
      artifacts, integration results, benchmark evidence, or other inspectable
      evidence.
    partially_proven: >-
      Implemented in meaningful pieces but not yet proven end-to-end, under
      required variation, or in the target environment.
    assumption: >-
      Required for the design to hold but not yet proven.
    roadmap: >-
      Intended future behavior that is not required for current conformance.

  claims:
    - id: CLAIM-001
      claim: >-
        img2threejs can serve as the preferred studio capability for reconstructing
        a specific object or character from supplied reference images into
        procedural Three.js.
      level: "partially_proven"
      required_evidence: >-
        Studio adapter integration, representative reference-image reconstructions,
        runtime import, required affordance extraction, and game-budget evidence.
      current_evidence: >-
        Upstream behavior and current demos show procedural THREE.Group generation,
        reference-review workflow, runtime nodes, sockets/colliders, and character
        rig support.
      gap: "Not yet proven through this studio's adapter and Gauntlet contracts."

    - id: CLAIM-002
      claim: >-
        3dviz-pro-max can serve as the preferred world/scene composition capability.
      level: "partially_proven"
      required_evidence: >-
        Studio adapter integration across multiple environment styles, terrain
        handoff, navigation handoff, runtime-budget evidence, and Gauntlet review.
      current_evidence: >-
        Upstream provides Three.js scene workflows, environment recipes, layout
        planning, kits, LOD, colliders, and capture-based inspection.
      gap: "Studio-level routing and target-game evidence do not yet exist."

    - id: CLAIM-003
      claim: >-
        Needle can act as the game-runtime integration layer without making its
        scene representation authoritative over studio/game semantics.
      level: "assumption"
      required_evidence: >-
        End-to-end reference project proving Three.js interoperability,
        observability, Rapier integration, Blender handoff, and production build.
      current_evidence: "Upstream integration capabilities and documentation."
      gap: "No studio reference game yet."

    - id: CLAIM-004
      claim: >-
        One authoritative Three.js installation can satisfy the generated output
        of studio capabilities and the selected runtime without duplicate-module
        failures.
      level: "assumption"
      required_evidence: >-
        Dependency graph proof plus runtime tests of representative 3dviz and
        img2threejs outputs under the pinned studio Three.js owner.
      current_evidence: "No studio integration evidence yet."
      gap: "Version/API compatibility must be proved, not assumed."

    - id: CLAIM-005
      claim: >-
        A three-channel observation contract of state, pixels, and telemetry can
        materially reduce false settlement compared with screenshot-only review.
      level: "assumption"
      required_evidence: >-
        Fault-injection tests where each observation channel detects failures
        invisible to one or both of the others.
      current_evidence: "Design rationale only."
      gap: "Reference implementation and adversarial evaluation required."

    - id: CLAIM-006
      claim: >-
        The studio can produce polished browser-game quality approaching the
        practical high end of the target browser/hardware profile.
      level: "assumption"
      required_evidence: >-
        A representative game with a declared quality bar, measured technical-art
        budgets, active-play visual evidence, stable performance, and independent
        review.
      current_evidence: "None for the integrated studio."
      gap: "Must be demonstrated by a reference game; library selection alone is insufficient."

system_overview:
  architecture_pattern:
    primary: >-
      Capability-routed, adapter-mediated, evidence-driven studio with a
      Three.js-compatible runtime and separate authoritative game semantics.
    rationale: >-
      Stable capability contracts keep provider choice small at the decision
      point, allow detailed provider instructions to load only after routing,
      preserve upgradeability, and make verification operate on outcomes rather
      than vendor success signals.
    intentionally_not_used:
      - pattern: "Monolithic provider-centric game engine abstraction."
        reason: >-
          It would duplicate mature upstream systems and make scene/runtime
          implementation details authoritative over game semantics.
      - pattern: "Fork-everything integration."
        reason: >-
          It creates unnecessary maintenance debt and obscures which affordance
          required divergence from upstream.
      - pattern: "Scene graph as authoritative game model."
        reason: >-
          Rendering structure is an execution projection and cannot reliably own
          gameplay semantics, relationships, or settlement state.
      - pattern: "Screenshot-only agent verification."
        reason: >-
          Pixels cannot prove semantic state, navigation, physics correctness, or
          runtime budget compliance.

  main_components:
    - name: "Studio Director"
      responsibility: >-
        Translate user/game intent into capability requests, preserve constraints,
        and coordinate specialist routing without loading irrelevant provider detail.
      inputs:
        - "Game specification or user requirement."
        - "Project state and frozen acceptance criteria."
      outputs:
        - "CapabilityRequest."
        - "Bounded orchestration decisions."

    - name: "Capability Registry and Router"
      responsibility: >-
        Describe each stable capability, positive and negative affordances,
        accepted inputs, outputs, provider preferences, fallbacks, cost/constraints,
        and proof requirements; select an eligible provider.
      inputs:
        - "CapabilityRequest."
        - "Project configuration and provider availability."
      outputs:
        - "Selected provider route or typed blocked result."

    - name: "Provider Adapters"
      responsibility: >-
        Invoke specialist upstream tools without making them studio-aware and
        normalize provider-specific results into studio contracts.
      inputs:
        - "Admitted CapabilityRequest."
      outputs:
        - "CapabilityResult."
        - "Assets/evidence/provider diagnostics."

    - name: "Asset Registry and Compiler"
      responsibility: >-
        Own production asset identity, provenance, route history, runtime budgets,
        semantic affordances, acceptance state, and offline normalization.
      inputs:
        - "User-provided, sourced, generated, or Blender-produced assets."
      outputs:
        - "Accepted AssetRecord."
        - "Runtime-ready asset artifacts."

    - name: "Game Runtime Integration"
      responsibility: >-
        Project authoritative game state into a Three.js-compatible runtime and
        connect rendering, physics, navigation, interaction, audio, and content
        systems without collapsing their ownership boundaries.
      inputs:
        - "Game state."
        - "Accepted assets and world representations."
      outputs:
        - "Runnable browser game."
        - "Runtime semantic and telemetry surfaces."

    - name: "Observability Bridge"
      responsibility: >-
        Expose deterministic development/test controls and stable read interfaces
        over game state, scene, physics, navigation, renderer, assets, scenarios,
        errors, and named cameras.
      inputs:
        - "Running development/test game."
      outputs:
        - "Machine-readable state observations."
        - "Deterministic scenario controls."
        - "Runtime telemetry."

    - name: "Gauntlet Verification and Evidence"
      responsibility: >-
        Compare frozen expectations with observed consequences, preserve immutable
        run evidence, classify mismatches, and determine settlement or blockage.
      inputs:
        - "Acceptance criteria."
        - "State, pixel, and telemetry observations."
      outputs:
        - "EvidenceManifest."
        - "SettlementRecord."
        - "Blocked/correction classification."

  component_diagram:
    mermaid: |-
      flowchart LR
        User["User / Game Spec"] --> Director["Studio Director"]
        Director --> Router["Capability Registry + Router"]
        Router --> Adapters["Provider Adapters"]
        Adapters --> Assets["Asset Registry / Compiler"]
        Adapters --> Runtime["Game Runtime"]
        Assets --> Runtime
        Runtime --> Observe["Observability Bridge"]
        Observe --> Verify["Gauntlet Verification"]
        Verify --> Evidence["Evidence + Settlement"]
        Verify -->|mismatch| Director

  external_dependencies:
    - name: "Three.js-compatible runtime owner"
      purpose: >-
        Own the single runtime Three.js installation and browser scene execution.
        Current preferred provider: Needle Engine over Three.js.
      failure_behavior: >-
        Runtime capability is blocked; adapters MUST NOT introduce a second
        incompatible Three.js installation as an implicit workaround.

    - name: "Authoritative game-state system"
      purpose: >-
        Store game semantics independently from render objects. Current preferred
        provider: Koota.
      failure_behavior: >-
        Gameplay systems MUST NOT silently fall back to using scene objects as
        authoritative state.

    - name: "Physics"
      purpose: >-
        Collision/dynamics/character physical behavior. Current preferred provider:
        Needle's Rapier integration.
      failure_behavior: >-
        Physics-dependent capabilities are blocked or explicitly degraded; render
        geometry MUST NOT be assumed to be valid physics geometry.

    - name: "Navigation"
      purpose: >-
        Navmesh generation, pathfinding, and crowd/navigation queries. Current
        preferred provider: Recast Navigation JS.
      failure_behavior: >-
        Navigation-dependent settlement MUST fail or block; hand-authored path
        guesses MUST NOT masquerade as equivalent navmesh proof.

    - name: "Spatial acceleration"
      purpose: >-
        Fast scene/mesh raycasts and spatial queries. Current preferred provider:
        three-mesh-bvh.
      failure_behavior: >-
        Features MAY use slower correct fallbacks if explicitly supported and
        budget-compliant; correctness MUST precede acceleration.

    - name: "World/scene composition"
      purpose: >-
        Compose environments, architecture, vegetation, lighting, atmosphere, and
        scene direction. Current preferred provider: 3dviz-pro-max.
      failure_behavior: >-
        World-generation requests block or route to an explicitly declared
        alternative; they MUST NOT be misrouted to img2threejs.

    - name: "Reference-image reconstruction"
      purpose: >-
        Reconstruct a specific depicted object or character from supplied images
        into procedural Three.js. Current preferred provider: img2threejs.
      failure_behavior: >-
        If no suitable reference image exists, the route MUST request/procure an
        allowed reference or select a different capability rather than inventing
        a reference silently.

    - name: "Browser automation"
      purpose: >-
        Explore, interact with, and deterministically verify running games.
        Current exploratory provider: agent-browser. Current proof provider:
        Playwright.
      failure_behavior: >-
        Required browser verification is blocked; a build or static inspection
        MUST NOT substitute for missing runtime proof.

core_domain_model:
  scope_rule: >-
    Stable entities exist only where the studio must route, correlate, validate,
    audit, retry, verify, or hand off work across provider boundaries. Provider
    commands, vendor-specific scene nodes, editor objects, internal tool state,
    and transient browser handles remain adapter/runtime details.

  entities:
    - name: "CapabilityDescriptor"
      purpose: >-
        Define one stable studio affordance independently of the current provider.
      used_by:
        - "Studio Director"
        - "Capability Registry and Router"
        - "Skill discovery/linting"
      required_fields:
        - name: "id"
          type: "string"
          meaning: "Stable dotted capability ID."
        - name: "summary"
          type: "string"
          meaning: "Concise provider-neutral description."
        - name: "use_when"
          type: "array[string]"
          meaning: "Positive routing triggers."
        - name: "do_not_use_when"
          type: "array[string]"
          meaning: "Negative affordances separating adjacent capabilities."
        - name: "inputs"
          type: "array[string]"
          meaning: "Accepted semantic inputs."
        - name: "outputs"
          type: "array[string]"
          meaning: "Promised normalized output classes."
        - name: "verification"
          type: "array[string]"
          meaning: "Required proof categories."
        - name: "providers"
          type: "array[string]"
          meaning: "Ordered eligible provider bindings."
      optional_fields:
        - "fallback_policy"
        - "cost_class"
        - "requires_user_reference"
        - "security_class"
      rules:
        - "A capability ID MUST remain stable when its provider changes."
        - "A descriptor MUST include at least one positive trigger."
        - >-
          A descriptor SHOULD include negative affordances when another studio
          capability could plausibly receive the same request.
        - "Provider-specific instructions MUST NOT leak into provider-neutral semantics."

    - name: "CapabilityRequest"
      purpose: >-
        Represent admitted work before provider selection.
      used_by:
        - "Studio Director"
        - "Capability Router"
        - "Provider Adapters"
      required_fields:
        - name: "id"
          type: "string"
          meaning: "Stable request/run correlation identifier."
        - name: "project_id"
          type: "string"
          meaning: "Target game project."
        - name: "capability_id"
          type: "string"
          meaning: "Requested stable capability."
        - name: "intent"
          type: "string"
          meaning: "Desired outcome in domain terms."
        - name: "acceptance"
          type: "array[string]"
          meaning: "Frozen conditions required for this request to settle."
        - name: "inputs"
          type: "object"
          meaning: "Validated references to request inputs, not embedded secrets."
      optional_fields:
        - "preferred_provider"
        - "budget"
        - "quality_profile"
        - "reference_ids"
      rules:
        - "The request MUST be provider-neutral at admission."
        - "Acceptance criteria MUST be recorded before settlement evidence is evaluated."

    - name: "CapabilityResult"
      purpose: >-
        Normalize a provider invocation outcome for downstream studio consumers.
      used_by:
        - "Provider Adapters"
        - "Asset Registry"
        - "Gauntlet Verification"
      required_fields:
        - name: "id"
          type: "string"
          meaning: "Result identifier."
        - name: "request_id"
          type: "string"
          meaning: "CapabilityRequest correlation."
        - name: "provider"
          type: "string"
          meaning: "Provider actually used."
        - name: "status"
          type: "enum"
          meaning: "success | blocked | failed | degraded"
        - name: "artifacts"
          type: "array[artifact-ref]"
          meaning: "Produced files/resources with hashes where persistent."
        - name: "diagnostics"
          type: "object"
          meaning: "Provider and normalization diagnostics safe for evidence."
      optional_fields:
        - "asset_ids"
        - "affordances"
        - "degradation_reason"
      rules:
        - "A provider success MUST NOT imply studio verification success."
        - "Any fallback provider MUST be explicit in provider and diagnostics."

    - name: "AssetRecord"
      purpose: >-
        Provide the authoritative production identity and acceptance history for
        every external or generated game asset.
      used_by:
        - "Asset Registry and Compiler"
        - "Game Runtime"
        - "Release qualification"
      required_fields:
        - name: "id"
          type: "string"
          meaning: "Stable project-local asset ID."
        - name: "role"
          type: "string"
          meaning: "Gameplay/visual role, such as hero_vehicle or background_tree."
        - name: "origin"
          type: "enum"
          meaning: "user | project | cc0 | licensed | generated | blender | procedural"
        - name: "construction_route"
          type: "string"
          meaning: "Capability/provider route that produced or imported the asset."
        - name: "source_provenance"
          type: "object"
          meaning: "Source URI/ref, license/authorization, hashes, and retrieval metadata."
        - name: "runtime_representation"
          type: "string"
          meaning: "Procedural Three.js, GLB/glTF, texture set, audio, etc."
        - name: "budget"
          type: "object"
          meaning: "Applicable game-specific runtime budgets."
        - name: "acceptance_state"
          type: "enum"
          meaning: "pending | accepted | rejected | blocked | degraded"
      optional_fields:
        - "semantic_nodes"
        - "sockets"
        - "collider_policy"
        - "lod_policy"
        - "animation_contract"
        - "verification_refs"
      rules:
        - "No production asset is accepted without provenance state."
        - "User-provided references MUST be distinguished from shipped source assets."
        - "Blender output MUST remain a derived asset, not authoritative game state."

    - name: "ObservationRun"
      purpose: >-
        Define one fresh, reproducible execution in which a game scenario is
        observed.
      used_by:
        - "Observability Bridge"
        - "Playwright proof harness"
        - "Gauntlet Verification"
      required_fields:
        - name: "id"
          type: "string"
          meaning: "Unique run ID."
        - name: "project_revision"
          type: "string"
          meaning: "Commit or equivalent immutable project revision."
        - name: "scenario_id"
          type: "string"
          meaning: "Named scenario under observation."
        - name: "environment"
          type: "object"
          meaning: "Browser, viewport, quality profile, platform/device class."
        - name: "channels"
          type: "array"
          meaning: "Observed state, pixel, and telemetry channels."
      optional_fields:
        - "seed"
        - "input_trace"
        - "camera_views"
      rules:
        - "A settlement-critical run MUST identify its project revision."
        - "Required observations from different historical runs MUST NOT be merged into a fictional complete run."

    - name: "EvidenceManifest"
      purpose: >-
        Bind proof artifacts to one ObservationRun and declare what each artifact
        supports.
      used_by:
        - "Gauntlet Verification"
        - "CI/release qualification"
      required_fields:
        - name: "id"
          type: "string"
          meaning: "Evidence manifest ID."
        - name: "run_id"
          type: "string"
          meaning: "ObservationRun correlation."
        - name: "requirement_ids"
          type: "array[string]"
          meaning: "Normative/game requirements this evidence is intended to support."
        - name: "artifacts"
          type: "array[artifact-ref]"
          meaning: "Hashed state snapshots, captures, metrics, traces, logs, or reports."
        - name: "result"
          type: "enum"
          meaning: "pass | fail | blocked | incomplete"
      optional_fields:
        - "confirmation_mode"
        - "reviewer"
        - "contradictions"
      rules:
        - "Failed or contradictory evidence MUST NOT be overwritten."
        - "Freshness MUST be determined from run/revision identity, not filename convention."

    - name: "SettlementRecord"
      purpose: >-
        Record the Gauntlet decision for one frozen expectation.
      used_by:
        - "Gauntlet Verification"
        - "Project current status"
      required_fields:
        - name: "id"
          type: "string"
          meaning: "Settlement decision ID."
        - name: "requirement_ids"
          type: "array[string]"
          meaning: "Requirements being decided."
        - name: "decision"
          type: "enum"
          meaning: "settled | blocked | failed | incomplete"
        - name: "evidence_manifest_ids"
          type: "array[string]"
          meaning: "Evidence actually used."
        - name: "reason"
          type: "string"
          meaning: "Concise consequence-based decision rationale."
      optional_fields:
        - "blockage_class"
        - "confirmation_ref"
        - "next_affordance"
      rules:
        - "Settlement MUST be based on evidence, not provider completion."
        - "A missing required confirmation MUST prevent settled status."

  identifiers_and_normalization:
    primary_id_rule: >-
      Persistent IDs MUST be stable, lower-case where human-authored, and
      namespace-qualified when collisions are plausible.
    human_readable_rule: >-
      Logs SHOULD show both stable ID and concise display name where one exists.
    normalized_identifier_rule: >-
      Capability IDs use lower-case dotted namespaces; asset/scenario identifiers
      use lower-case ASCII letters, digits, dots, hyphens, and underscores after
      validation. Normalization collisions MUST fail rather than overwrite.
    path_or_resource_rule: >-
      Persistent project paths MUST be project-relative in manifests. External
      URLs, hashes, and provider identifiers MUST remain distinct from local paths.
    unsafe_input_rule: >-
      External URLs, filenames, archive contents, generated code, and provider
      responses are untrusted until validated. They MUST NOT be interpolated into
      privileged shell commands without safe argument handling.

configuration_and_input_contract:
  configuration_sources_precedence:
    - order: 1
      source: "Current explicit user/game requirement."
    - order: 2
      source: "Game project specification and project-local studio configuration."
    - order: 3
      source: "Pinned studio capability registry and provider bindings."
    - order: 4
      source: "Documented studio defaults."
    - order: 5
      source: "Environment/secret indirection."

  resolution_rules:
    - id: REQ-CONFIG-001
      text: >-
        Explicit game/project constraints MUST override studio defaults unless
        doing so would violate a safety, licensing, or trust requirement.
    - id: REQ-CONFIG-002
      text: >-
        Provider credentials and machine-specific paths MUST be supplied by
        environment/secret/config indirection and MUST NOT be embedded in skills,
        source, or game assets.
    - id: REQ-CONFIG-003
      text: >-
        Provider availability MUST influence provider selection only after the
        required capability has been identified.
    - id: REQ-CONFIG-004
      text: >-
        The runtime MUST resolve to one authoritative Three.js installation;
        adapters MUST consume that project-owned installation rather than adding
        private runtime copies.
    - id: REQ-CONFIG-005
      text: >-
        Game-specific quality profiles and technical-art budgets MUST live in the
        game project, not in provider adapters.
    - id: REQ-CONFIG-006
      text: >-
        Skill metadata MUST follow the studio description contract: descriptions
        MUST be <=1024 characters, SHOULD be 120-500 characters, SHOULD target
        200-400 characters, MUST state the primary capability/trigger, and SHOULD
        state a negative affordance when routing collision is plausible.

  required_config_fields:
    - field: "project_id"
      type: "string"
      required: true
      default: null
      validation: "Valid normalized project identifier."
    - field: "studio_revision"
      type: "string"
      required: true
      default: null
      validation: "Pinned immutable studio revision or release."
    - field: "runtime.three_owner"
      type: "string"
      required: true
      default: "project-runtime"
      validation: "Exactly one authoritative Three.js resolution path."
    - field: "evidence_root"
      type: "path"
      required: true
      default: "artifacts/runs"
      validation: "Project-relative writable path outside shipped runtime assets."
    - field: "quality_profiles"
      type: "object"
      required: true
      default: "{}"
      validation: "At least one project-defined target profile before release qualification."
    - field: "external_asset_policy"
      type: "object"
      required: true
      default: "{}"
      validation: "Must define allowed provenance/license states and web-search policy."

  error_classes:
    - code: "missing_config_error"
      blast_radius: "Blocks the capability or project operation requiring the field."
    - code: "parse_error"
      blast_radius: "Blocks loading the affected contract/configuration."
    - code: "schema_error"
      blast_radius: "Blocks the affected capability or manifest."
    - code: "unsupported_kind_error"
      blast_radius: "Blocks only the unsupported request unless project startup depends on it."
    - code: "missing_credential_error"
      blast_radius: "Blocks only providers requiring that credential; does not redefine the requested capability."
    - code: "input_validation_error"
      blast_radius: "Blocks the affected operation."
    - code: "routing_error"
      blast_radius: "Blocks provider execution until a capability/provider can be selected unambiguously."
    - code: "compatibility_error"
      blast_radius: "Blocks the incompatible adapter/runtime path."
    - code: "provenance_error"
      blast_radius: "Blocks production acceptance of the affected asset."
    - code: "verification_error"
      blast_radius: "Blocks settlement of affected requirements."
    - code: "budget_error"
      blast_radius: "Blocks acceptance under the affected quality profile."

  error_surface_requirements:
    - "Errors MUST include a stable code, concise message, and recoverability hint where possible."
    - "Errors MUST NOT include secrets or excessive raw configuration."
    - "Routing errors SHOULD name the conflicting or unavailable capabilities/providers."
    - "Verification errors MUST name missing or contradictory evidence channels."

  dynamic_reload:
    status: "optional"
    requirements:
      - "Capability registry changes MUST be validated before activation."
      - "In-flight runs MUST retain the registry/provider revision with which they started."
      - "Invalid reload MUST leave the previous valid registry active."
      - "Game runtime hot reload MUST NOT alter frozen settlement evidence."

  startup_preflight:
    requirements:
      - id: REQ-CONFIG-010
        text: >-
          `studio doctor` or its equivalent MUST validate project schema,
          authoritative Three.js resolution, required runtime dependencies,
          capability registry integrity, skill metadata constraints, provider
          availability, and evidence-root writability.
      - id: REQ-CONFIG-011
        text: >-
          Capability execution MUST validate its required inputs and provider
          prerequisites immediately before privileged or expensive work.
      - id: REQ-CONFIG-012
        text: >-
          Preflight failure MUST be scoped to the affected capability whenever
          the rest of the project can remain valid.

  primary_input:
    type: "Game specification or CapabilityRequest"
    source: "User/project agent"

    required_fields:
      - name: "intent"
        type: "string"
        validation: "Non-empty desired outcome."
      - name: "acceptance"
        type: "array[string]"
        validation: "At least one observable acceptance criterion for settlement-critical work."

    optional_fields:
      - "references"
      - "budget"
      - "preferred representation/provider"
      - "quality profile"

    invalid_input_behavior:
      missing_required: "Return typed input_validation_error before provider selection."
      invalid_value: "Reject or request bounded correction; do not silently coerce material semantics."
      duplicate_request: >-
        Reuse prior accepted artifacts only when idempotency/provenance rules allow;
        new settlement still requires evidence appropriate to the current project revision.
      out_of_scope: "Return unsupported_kind_error and name the nearest supported boundary if known."
      unsafe: "Reject before privileged side effects."

operational_flow_and_state_model:
  flow_summary:
    primary_flow:
      - "Freeze the requested outcome and acceptance criteria."
      - "Resolve the request to a stable studio capability."
      - "Select an eligible provider using capability policy and availability."
      - "Invoke the provider through its adapter and normalize the result."
      - "Integrate the result into the game/project representation."
      - "Run the target scenario under the observability contract."
      - "Collect state, pixel, and telemetry evidence as required."
      - "Gauntlet decides settle, blocked, failed, or incomplete."
      - "On mismatch, classify the blockage and perform a bounded correction or representation change."

  flow_diagram:
    mermaid: |-
      flowchart TD
        A["Freeze expectation"] --> B["Resolve capability"]
        B --> C["Select provider"]
        C -->|none eligible| X["Blocked"]
        C --> D["Execute adapter"]
        D -->|provider failure| R["Bounded recovery / alternate eligible provider"]
        R --> C
        D --> E["Normalize + integrate"]
        E --> F["Run scenario"]
        F --> G["Observe state + pixels + telemetry"]
        G --> H["Gauntlet compare"]
        H -->|pass| I["Required confirmation"]
        I --> J["Settled"]
        H -->|mismatch| K["Classify blockage"]
        K --> L["Correction or representation change"]
        L --> F

  service_states:
    stateful_object: "CapabilityRequest"
    states:
      - name: "admitted"
        meaning: "Request and frozen acceptance are valid; no provider has executed yet."
        entry_trigger: "Input validation succeeds."
        exit_trigger: "Routing selects provider or declares blocked."
      - name: "executing"
        meaning: "Selected provider/adapter is performing work."
        entry_trigger: "Provider prerequisites pass."
        exit_trigger: "Provider returns normalized result or fails."
      - name: "integrated"
        meaning: "Normalized result is connected to target project/runtime representation."
        entry_trigger: "Integration checks pass."
        exit_trigger: "Observation begins or integration is invalidated."
      - name: "verifying"
        meaning: "Fresh scenario execution and evidence collection are in progress."
        entry_trigger: "ObservationRun starts."
        exit_trigger: "Gauntlet issues decision."
      - name: "settled"
        meaning: "Required evidence and confirmation support the frozen expectation."
        entry_trigger: "Gauntlet settlement criteria pass."
        exit_trigger: "Requirement is materially changed or invalidating evidence is introduced."
      - name: "blocked"
        meaning: "Required capability cannot currently proceed without a missing input, affordance, authorization, or environment."
        entry_trigger: "Typed blockage condition occurs."
        exit_trigger: "Blocking condition is resolved and request is re-admitted."
      - name: "failed"
        meaning: "Attempt produced a terminal or explicitly abandoned failure."
        entry_trigger: "Nonrecoverable provider/integration/verification failure."
        exit_trigger: "A new request/attempt is created."

  transition_rules:
    - from: "admitted"
      to: "executing"
      when: "Exactly one eligible provider route or explicitly selected allowed route is available."
    - from: "admitted"
      to: "blocked"
      when: "No eligible route exists or a required user/reference input is missing."
    - from: "executing"
      to: "integrated"
      when: "Provider result normalizes and integration checks pass."
    - from: "integrated"
      to: "verifying"
      when: "Fresh observation scenario begins."
    - from: "verifying"
      to: "settled"
      when: "All required evidence and confirmation pass."
    - from: "verifying"
      to: "blocked"
      when: "A required observation/confirmation cannot be obtained."
    - from: "verifying"
      to: "failed"
      when: "Evidence contradicts an unrecoverable requirement."

  transition_triggers:
    - name: "provider_route_selected"
      behavior: "Records capability/provider binding and immutable provider revision for the attempt."
    - name: "evidence_contradiction"
      behavior: "Prevents settlement and creates blockage/correction classification."
    - name: "requirement_changed"
      behavior: "Invalidates prior settlement for the changed requirement without deleting evidence."
    - name: "provider_fallback"
      behavior: "Creates explicit routing event; never silently substitutes provider semantics."

  idempotency_rule: >-
    Reprocessing the same immutable CapabilityRequest with identical inputs MAY
    reuse deterministic cached provider artifacts when their provenance and
    hashes match, but verification for a changed game revision MUST still produce
    fresh run evidence where runtime consequence could have changed.

  important_nuances:
    - >-
      Provider availability is not capability semantics: a missing API key may
      block one provider but MUST NOT redefine the requested job.
    - >-
      User/reference imagery gives img2threejs a specific reconstruction target;
      absent imagery MUST NOT cause it to be treated as a generic text-to-3D generator.
    - >-
      Blender may be the correct escalation route without becoming the game or
      asset source of semantic truth.
    - >-
      A visual pass may succeed while semantic or telemetry evidence fails; the
      overall requirement remains unsettled.

core_behavior_requirements:
  capability_routing:
    - id: "REQ-ROUTE-001"
      text: >-
        The director MUST identify the stable capability before loading detailed
        provider instructions or invoking provider-specific tools.
    - id: "REQ-ROUTE-002"
      text: >-
        Capability descriptions MUST state positive triggers and SHOULD state
        negative affordances sufficient to distinguish nearest competing routes.
    - id: "REQ-ROUTE-003"
      text: >-
        The router MUST prefer the smallest representation that can satisfy the
        requirement without violating project quality, provenance, or runtime constraints.
    - id: "REQ-ROUTE-004"
      text: >-
        Detailed provider skills/references SHOULD be loaded only after routing,
        preserving progressive disclosure and reducing context competition.
    - id: "REQ-ROUTE-005"
      text: >-
        The studio MUST NOT select a provider solely because it is installed,
        familiar, credentialed, or more generative.
    - id: "REQ-ROUTE-006"
      text: >-
        Fallbacks MUST preserve the requested capability semantics or surface a
        degraded/blocked result; they MUST NOT silently change the job.

  skill_metadata:
    - id: "REQ-SKILL-001"
      text: >-
        Studio-owned skill descriptions MUST fit the description-length contract
        in REQ-CONFIG-006 and MUST optimize for routing discrimination rather than
        comprehensive documentation.
    - id: "REQ-SKILL-002"
      text: >-
        A studio lint check MUST detect schema violations and SHOULD flag routing
        collisions where multiple skills claim the same trigger without a clear
        distinguishing boundary.
    - id: "REQ-SKILL-003"
      text: >-
        Detailed workflows, provider commands, and edge cases MUST live inside
        the activated skill or references, not in globally loaded descriptions.

  current_preferred_bindings:
    - id: "REQ-BIND-001"
      text: >-
        The current preferred runtime binding is Needle Engine over the
        project-owned Three.js-compatible runtime; this binding is replaceable
        if another provider satisfies the same studio contracts.
    - id: "REQ-BIND-002"
      text: >-
        The current preferred authoritative ECS/game-state binding is Koota.
    - id: "REQ-BIND-003"
      text: >-
        The current preferred navigation binding is Recast Navigation JS.
    - id: "REQ-BIND-004"
      text: >-
        The current preferred spatial-query acceleration binding is three-mesh-bvh.
    - id: "REQ-BIND-005"
      text: >-
        The current preferred environment-composition binding is 3dviz-pro-max.
    - id: "REQ-BIND-006"
      text: >-
        The current preferred reference-image reconstruction binding is
        img2threejs, and this route REQUIRES suitable reference imagery.
    - id: "REQ-BIND-007"
      text: >-
        The current preferred generic game-development specialist pack is
        threejs-game-skills, adapted/overlaid so studio routing policy remains authoritative.
    - id: "REQ-BIND-008"
      text: >-
        The current preferred offline glTF normalization/optimization binding is
        glTF-Transform with project-approved texture/mesh compression.
    - id: "REQ-BIND-009"
      text: >-
        The current preferred particle/VFX binding is three.quarks where its
        representation fits the effect.
    - id: "REQ-BIND-010"
      text: >-
        The current preferred deterministic browser-proof binding is Playwright;
        agent-browser is exploratory and MUST NOT be the sole settlement oracle.
    - id: "REQ-BIND-011"
      text: >-
        Blender is the preferred DCC escalation provider for operations that
        cannot be settled adequately through browser-native, procedural, sourced,
        or reference-reconstruction routes; Unity integration is out of scope.

  reference_and_asset_intake:
    - id: "REQ-ASSET-001"
      text: >-
        When reconstructing a specific depicted object or character, the studio
        MUST prefer a user-supplied suitable image and route through
        asset.reconstruct.reference-image/img2threejs.
    - id: "REQ-ASSET-002"
      text: >-
        If a required reference is not supplied, the studio SHOULD next prefer
        project-owned/authorized or clearly licensed/public-domain references;
        it MAY ask the user for an image before conducting open web search.
    - id: "REQ-ASSET-003"
      text: >-
        Open-web reference acquisition MUST preserve source URL/reference,
        retrieval metadata, license/authorization assessment, and source hash
        where the source is retained.
    - id: "REQ-ASSET-004"
      text: >-
        The studio MUST distinguish reference-only imagery from source material
        shipped or directly incorporated into the game.
    - id: "REQ-ASSET-005"
      text: >-
        For generic assets, the studio SHOULD prefer accepted existing project
        assets, suitable licensed/CC0 assets, or simple procedural construction
        before paid/opaque generative providers.
    - id: "REQ-ASSET-006"
      text: >-
        Every imported/generated asset MUST pass the project-required
        normalization, compression, LOD/collider, provenance, and runtime-budget
        gates before production acceptance.
    - id: "REQ-ASSET-007"
      text: >-
        The asset registry MUST preserve rejected and superseded production
        routes rather than rewriting history.

  blender_escalation:
    - id: "REQ-BLENDER-001"
      text: >-
        Blender MUST be treated as an escalation capability, not the default
        world/game authoring environment.
    - id: "REQ-BLENDER-002"
      text: >-
        Before Blender execution, the request MUST record why lower-cost or more
        agent-editable eligible routes are insufficient when that reason is not
        self-evident from the capability.
    - id: "REQ-BLENDER-003"
      text: >-
        Blender MAY be used for topology, UV work, baking, retopology, difficult
        rigging/skinning, animation editing/retargeting, geometry cleanup, and
        other operations where its representational power materially improves the outcome.
    - id: "REQ-BLENDER-004"
      text: >-
        Blender-produced geometry, rigs, animations, and textures MUST return
        through an accepted runtime asset handoff, preferably Needle's Blender
        integration when it fits the task, and MUST be registered as derived assets.
    - id: "REQ-BLENDER-005"
      text: >-
        Blender scene state MUST NOT own gameplay semantics that belong in the
        game/project model.

  runtime_authority:
    - id: "REQ-RUNTIME-001"
      text: >-
        Authoritative gameplay state MUST remain separate from Three.js/Needle
        scene objects, Rapier bodies, Recast navmesh objects, Blender objects, and
        other execution projections.
    - id: "REQ-RUNTIME-002"
      text: >-
        Runtime adapters MUST maintain stable IDs sufficient to correlate an
        authoritative game entity with its render, physics, navigation, audio,
        and asset projections where such correlation is needed.
    - id: "REQ-RUNTIME-003"
      text: >-
        A generated or sourced asset MAY expose semantic nodes, sockets, pivots,
        collider descriptors, destruction groups, or rigs, but these affordances
        do not automatically become game semantics until bound by the game model.
    - id: "REQ-RUNTIME-004"
      text: >-
        The project runtime MUST own exactly one compatible Three.js dependency
        graph for runtime scene objects.

  observability:
    - id: "REQ-OBS-001"
      text: >-
        Development/test builds MUST expose a stable studio observability bridge
        at `window.__GAME_STUDIO__` or an explicitly versioned equivalent surface.
    - id: "REQ-OBS-002"
      text: >-
        The observability bridge MUST provide deterministic readiness, pause/resume,
        fixed-step or bounded-step control where supported, scenario load/reset,
        seed control where stochastic behavior matters, named camera/view control,
        semantic-state reads, error reads, and renderer/performance reads.
    - id: "REQ-OBS-003"
      text: >-
        The bridge SHOULD expose physics and navigation inspection when those
        systems are present and settlement depends on them.
    - id: "REQ-OBS-004"
      text: >-
        Settlement-critical observability interfaces MUST be stable enough for
        Playwright and Gauntlet to consume without depending on transient DOM or
        provider-internal object names.
    - id: "REQ-OBS-005"
      text: >-
        Privileged mutation/debug capabilities exposed for testing MUST be absent
        or authorization-gated in production builds.

  verification_and_gauntlet:
    - id: "REQ-GAUNTLET-001"
      text: >-
        The Gauntlet MUST operate around the entire studio output rather than
        treating any provider's internal validation as settlement.
    - id: "REQ-GAUNTLET-002"
      text: >-
        Each settlement-critical increment MUST have frozen expectations before
        its final evidence is evaluated.
    - id: "REQ-GAUNTLET-003"
      text: >-
        Verification MUST select the observation channels required by the claim:
        semantic state for game truth, pixels for visible consequence, telemetry
        for runtime consequence.
    - id: "REQ-GAUNTLET-004"
      text: >-
        On mismatch, the studio MUST classify whether the required concept is
        represented and affordable, represented but unavailable, a capability
        deficit, or insufficiently represented before blindly retrying.
    - id: "REQ-GAUNTLET-005"
      text: >-
        Corrections MUST be bounded and evidence-producing; repeated failure of
        the same approach SHOULD trigger a representation/provider reassessment.
    - id: "REQ-GAUNTLET-006"
      text: >-
        Settlement evidence MUST be fresh for the project revision and MUST
        preserve prior failed/contradictory runs.

  performance:
    - id: "REQ-PERF-001"
      text: >-
        Performance is a first-class acceptance dimension from the first
        representative playable scene and MUST NOT be deferred to a final cleanup phase.
    - id: "REQ-PERF-002"
      text: >-
        Each game MUST define at least one quality/performance profile before
        release qualification.
    - id: "REQ-PERF-003"
      text: >-
        Relevant verification runs MUST capture frame-time/FPS and renderer
        resource statistics sufficient to detect major regressions; game-specific
        specs MAY require additional GPU, memory, loading, or network metrics.
    - id: "REQ-PERF-004"
      text: >-
        An asset or scene that violates its declared runtime budget MUST remain
        rejected, degraded, or explicitly waived; visual quality alone cannot
        settle the requirement.

  source_integration:
    - id: "REQ-SOURCE-001"
      text: >-
        Runtime libraries SHOULD be normal pinned package dependencies rather
        than vendored repositories when their source/skill content does not need
        studio modification.
    - id: "REQ-SOURCE-002"
      text: >-
        Agent-facing upstream repositories MAY be kept as pinned subrepos when
        the studio needs to inspect, invoke, or lightly adapt their skill content.
    - id: "REQ-SOURCE-003"
      text: >-
        The studio SHOULD prefer adapters, overlays, configuration, and
        minimal patch files before permanent forks.
    - id: "REQ-SOURCE-004"
      text: >-
        If a fork is required, the delta from upstream SHOULD remain narrow,
        documented by the missing affordance, and continuously rebaseable.
    - id: "REQ-SOURCE-005"
      text: >-
        The current likely fork/overlay candidate is threejs-game-skills because
        its specialist skills are valuable while its generic provider-routing
        policy must remain subordinate to the studio capability registry.

  repository_boundary:
    - id: "REQ-REPO-001"
      text: >-
        The Game Studio SHOULD be maintained as one monorepo containing studio
        contracts, capability registry, adapters, studio-owned skills, CLI,
        templates, tests, evidence tooling, and selected agent-facing subrepos.
    - id: "REQ-REPO-002"
      text: >-
        Created games SHOULD live in separate repositories/directories and MUST
        remain independently buildable from pinned project dependencies and
        project-local manifests.
    - id: "REQ-REPO-003"
      text: >-
        The studio MAY retain one or more reference games inside the studio
        repository solely for integration/conformance testing.

  cli_and_operator_surface:
    - id: "REQ-CLI-001"
      text: >-
        The studio MUST expose a stable semantic CLI named `studio` or an
        explicitly versioned equivalent for agent automation.
    - id: "REQ-CLI-002"
      text: >-
        The semantic CLI MUST support structured machine-readable results and
        stable exit semantics for settlement-critical operations.
    - id: "REQ-CLI-003"
      text: >-
        The project SHOULD use `just` as a human/agent-friendly recipe façade for
        common development operations, but `just` MUST NOT be the sole semantic
        studio protocol.
    - id: "REQ-CLI-004"
      text: >-
        The minimum semantic CLI surface SHOULD include doctor, create,
        capabilities/describe, capability run, asset, observe, verify, and
        evidence operations; exact subcommand spelling is implementation-defined.
    - id: "REQ-CLI-005"
      text: >-
        `just --list` or equivalent SHOULD expose common repository operations
        without requiring agents to memorize internal commands.

  completion_rules:
    may_claim_completion_only_when:
      - "All REQUIRED requirements mapped to the current increment have evidence."
      - "Required state/pixel/telemetry channels have passed or are explicitly not applicable."
      - "Required provider/output integration has been exercised in the target environment."
      - "No blocking provenance, compatibility, budget, or confirmation requirement remains."
      - "The final claim level matches the actual evidence."

    must_report_incomplete_blocked_or_failed_when:
      - "A required provider/input/reference is unavailable and no allowed semantically equivalent route exists."
      - "A required browser/integration/confirmation test was skipped."
      - "Visual, semantic, or telemetry observations contradict the acceptance criteria."
      - "A production asset lacks required provenance or runtime acceptance."
      - "Evidence is historical, stale, or cannot be correlated to the current project revision."

execution_integration_contract:
  invocation:
    method: "CLI and library calls through studio adapters"
    required_parameters:
      - "project context"
      - "capability or operation"
    runtime_context: >-
      Project root for project-scoped operations; studio root for studio
      conformance/maintenance operations.
    authentication: >-
      Provider-specific credentials only when the selected provider requires
      them; credentials are resolved outside game/runtime source.
    timeout_policy: >-
      Provider and browser operations MUST have bounded timeouts/cancellation.
      Timeout MUST surface as blocked/failed rather than silently switching job semantics.

  result:
    type: "Structured StudioResult"

    success_fields:
      - "status"
      - "operation/capability"
      - "artifacts or result references"
      - "diagnostics/evidence references where applicable"

    failure_fields:
      - "error.code"
      - "error.message"
      - "error.recoverable"
      - "error.blockage_class"
      - "error.provider when applicable"

  external_side_effects:
    may_change:
      - "Files inside the target game/studio workspace."
      - "Project-local asset/evidence stores."
      - "Provider-side jobs explicitly admitted by the selected capability."
      - "Browser test/runtime processes."
      - "Blender processes when escalated."
    must_not_change:
      - "Unrelated user repositories/files."
      - "Upstream vendor repositories except through explicit update/patch workflows."
      - "Production credentials or remote resources not authorized by the current request."
      - "Frozen evidence artifacts from prior runs."

  sequence_diagram:
    mermaid: |-
      sequenceDiagram
        participant User as User/Game Agent
        participant Studio as Studio Director
        participant Router as Capability Router
        participant Provider as Provider Adapter
        participant Game as Game Runtime
        participant Evidence as Gauntlet/Evidence
        User->>Studio: requirement + acceptance
        Studio->>Router: CapabilityRequest
        Router-->>Studio: provider route
        Studio->>Provider: execute validated request
        Provider-->>Studio: CapabilityResult
        Studio->>Game: integrate/run scenario
        Game-->>Studio: state + pixels + telemetry
        Studio->>Evidence: preserve run artifacts
        Evidence-->>Studio: settled / blocked / failed / incomplete
        Studio-->>User: structured result

proof_and_observability:
  required_evidence_artifacts:
    - "Run manifest with run ID, project revision, scenario, environment, and requirement IDs."
    - "Machine-readable semantic-state snapshot or deterministic oracle output when behavior is claimed."
    - "Fresh screenshots and/or short motion captures for visual claims."
    - "Runtime telemetry appropriate to the project's quality profile."
    - "Browser console/page errors and relevant network/load diagnostics."
    - "Asset provenance/acceptance evidence for affected production assets."
    - "Playwright trace or equivalent deterministic interaction evidence for settlement-critical browser flows."

  evidence_policy:
    storage: "Project-local artifacts/runs/<run-id>/ by default."
    retention: >-
      Settlement-critical run evidence is append-only until explicit project
      retention policy archives it; failed/contradictory runs are retained at
      least as long as the requirement's correction history is material.
    access: "Project-local agents and authorized users; secrets excluded."
    correction_history: >-
      Failed or contradictory evidence MUST NOT be overwritten merely because a
      later run passes. Preserve provenance sufficient to reconstruct correction.

  proof_interface:
    preferred_commands:
      - "studio doctor --json"
      - "studio verify --profile <profile> --json"
      - "studio evidence check <run-id> --json"

    pass_condition: >-
      Exit zero means the requested proof operation completed and all REQUIRED
      checks in scope passed with fresh correlatable evidence. It does not imply
      requirements outside that operation's declared scope.
    fail_condition: >-
      Nonzero, skipped REQUIRED integration, missing evidence, stale evidence,
      contradiction, budget violation, or blocked confirmation prevents conformance
      for the affected scope.

  required_log_context:
    - "project_id"
    - "request_id/run_id"
    - "capability_id"
    - "provider when selected"
    - "state/reason code"
    - "project revision"

  required_metrics:
    - name: "frame_time_ms"
      reason: "Primary runtime smoothness signal; report distribution, not only average."
    - name: "fps"
      reason: "User-facing throughput summary under declared scenario/profile."
    - name: "renderer_draw_calls"
      reason: "Detect scene/asset batching and material regressions."
    - name: "renderer_triangles"
      reason: "Track geometry cost against game-specific budgets."
    - name: "renderer_textures"
      reason: "Track texture/resource growth."
    - name: "load/readiness_time"
      reason: "Detect regressions in browser game startup/scene readiness."
    - name: "console_error_count"
      reason: "Prevent visually plausible runs with runtime faults from settling."

  required_events:
    - "capability.requested"
    - "capability.routed"
    - "provider.started"
    - "provider.completed_or_failed"
    - "asset.registered_or_rejected"
    - "observation.started"
    - "evidence.recorded"
    - "gauntlet.settled_or_blocked_or_failed"
    - "fallback_or_representation_change"

repeatability_and_variation:
  required_variations:
    - id: VAR-001
      case: >-
        Reference-image reconstruction from a user-provided image for a specific
        object, followed by runtime integration and visual/runtime verification.
      expected: >-
        Routes to img2threejs, preserves reference provenance, integrates through
        the authoritative Three.js owner, and settles only after evidence passes.
    - id: VAR-002
      case: >-
        Environment request requiring composition plus terrain plus navigation.
      expected: >-
        Routes scene composition to 3dviz, terrain to the terrain capability when
        required, navigation to Recast, and verifies traversal/render/runtime consequences.
    - id: VAR-003
      case: >-
        Generic production asset that already exists in an allowed CC0/licensed source.
      expected: >-
        Reuses/source-imports the asset instead of invoking image reconstruction
        or opaque generation, records provenance, normalizes it, and verifies budgets.
    - id: VAR-004
      case: >-
        Asset operation that cannot meet requirements through browser-native,
        procedural, sourced, or img2threejs routes.
      expected: >-
        Records escalation rationale, routes to Blender, returns a derived runtime
        asset through the accepted handoff, and keeps game semantics outside Blender.
    - id: VAR-005
      case: "Provider unavailable while another semantically equivalent provider is allowed."
      expected: >-
        Explicitly records fallback selection and proves the same normalized
        capability contract; no silent degradation.
    - id: VAR-006
      case: "Visual pass with intentionally incorrect semantic state."
      expected: "Pixel channel may pass, semantic channel fails, requirement remains unsettled."
    - id: VAR-007
      case: "Semantic and visual pass with intentionally degraded frame performance."
      expected: "Telemetry channel fails, requirement remains unsettled."

  required_recovery_cases:
    - id: RECOV-001
      case: "Missing reference image for a request that specifically requires faithful reconstruction."
      expected: >-
        Ask for/locate an allowed reference or return blocked; do not silently
        reinterpret as generic text-to-3D.
    - id: RECOV-002
      case: "Incompatible or duplicate Three.js resolution detected."
      expected: >-
        Fail preflight with compatibility_error; do not run with multiple hidden
        Three.js instances.
    - id: RECOV-003
      case: "Generated/sourced asset exceeds declared runtime budget."
      expected: >-
        Remain unaccepted while bounded optimization/LOD/representation correction
        occurs; preserve original evidence.
    - id: RECOV-004
      case: "Required browser verification unavailable."
      expected: >-
        Report blocked/skipped and prevent final settlement rather than substituting
        static inspection.

  capability_claim_rule: >-
    A capability claim remains unverified until every REQUIRED variation and
    recovery case applicable to the target environment has passed.

failure_model_and_recovery:
  failure_classes:
    - name: "routing_failure"
      symptoms:
        - "No capability matches."
        - "Multiple capabilities/providers match without a deterministic precedence."
      required_behavior: >-
        Surface routing_error with conflicting candidates and missing distinction;
        do not choose arbitrarily.

    - name: "provider_failure"
      symptoms:
        - "Provider command/job fails, times out, or produces invalid output."
      required_behavior: >-
        Preserve diagnostics, classify recoverability, retry only within the
        provider/capability's bounded policy, then explicitly fallback or block.

    - name: "integration_failure"
      symptoms:
        - "Provider output cannot load, normalize, correlate, or run in the game."
      required_behavior: >-
        Fail the CapabilityResult integration state; provider success does not
        hide integration failure.

    - name: "representation_failure"
      symptoms:
        - "Repeated correction cannot satisfy shape, behavior, performance, or semantic needs."
      required_behavior: >-
        Reassess the selected representation/provider rather than adding unlimited
        cosmetic retries.

    - name: "evidence_failure"
      symptoms:
        - "Required observation missing, stale, contradictory, or from another revision."
      required_behavior: >-
        Keep requirement incomplete/blocked and record what evidence is absent or contradictory.

    - name: "provenance_failure"
      symptoms:
        - "Unknown or unacceptable asset/reference authorization or license state."
      required_behavior: >-
        Block production acceptance and select/request an allowed source.

  safe_failure_requirements:
    - id: REQ-SAFE-001
      text: >-
        Provider failure MUST NOT corrupt accepted assets, prior evidence, or
        unrelated project state.
    - id: REQ-SAFE-002
      text: >-
        Missing credentials, browser tooling, Blender, or external network access
        MUST surface as scoped capability blockage rather than silently lowering
        the requested outcome.
    - id: REQ-SAFE-003
      text: >-
        External assets, archives, URLs, and generated code MUST be validated
        before privileged execution or production acceptance.
    - id: REQ-SAFE-004
      text: >-
        The studio MUST preserve a recoverable last-known-valid capability registry
        and project configuration when reload/update validation fails.

  unsafe_behaviors:
    - "Executing arbitrary downloaded scripts merely because an asset/provider response references them."
    - "Embedding provider secrets in browser-side game code or evidence."
    - "Treating copyrighted/unknown-provenance material as automatically safe for production use."
    - "Allowing a visual screenshot to override contradictory authoritative state."
    - "Using Blender or a provider scene file as authoritative gameplay state."
    - "Overwriting failed evidence with later successful evidence."

  recoverable_failures:
    - failure: "Temporary provider/network failure."
      recovery: "Bounded retry; then explicit eligible fallback or blocked result."
    - failure: "Asset budget failure."
      recovery: "Optimize, LOD, compress, instance, simplify, or change representation; rerun proof."
    - failure: "Visual mismatch with correct semantic state."
      recovery: "Bounded art/scene correction while preserving semantic expectation."
    - failure: "Skill routing collision."
      recovery: "Refine capability/skill descriptions and rerun routing tests before execution."

  nonrecoverable_or_operator_required:
    - failure: "No legal/authorized source exists for required external content."
      behavior: "Request user-provided/authorized material or change the requirement."
    - failure: "Required capability exceeds target browser/hardware feasibility."
      behavior: "Surface constraint conflict; require game-spec or quality-profile change."
    - failure: "User explicitly requires a representation/provider prohibited by project policy."
      behavior: "Stop and request policy/requirement resolution."

security_safety_trust_boundaries:
  trusted_inputs:
    - "Approved project specification and project-local configuration."
    - "Pinned studio schemas and capability registry after validation."
    - "Accepted AssetRecords."

  untrusted_inputs:
    - "Open-web pages, images, archives, models, textures, audio, and metadata."
    - "Provider-generated source/code/assets before validation."
    - "User-supplied filenames/archives/URLs until validated."
    - "Browser/runtime page content."
    - "Upstream repository updates before pin/validation."

  trusted_actors:
    - "Authorized user/project agent operating within the project workspace."
    - "Studio CI under project-controlled credentials."

  privileged_operations:
    - "Launching provider jobs that spend credits."
    - "Executing Blender or external binaries."
    - "Writing or deleting project files."
    - "Downloading/unpacking external assets."
    - "Creating networked multiplayer/external service resources."
    - "Using provider credentials."

  mandatory_requirements:
    - id: REQ-SEC-001
      text: >-
        Provider credentials MUST be server/agent-side secrets and MUST NOT enter
        browser bundles, public asset manifests, or evidence artifacts.
    - id: REQ-SEC-002
      text: >-
        External archives/files MUST be constrained to intended project paths and
        validated against traversal/unsafe file types before extraction/execution.
    - id: REQ-SEC-003
      text: >-
        Network/resource side effects with cost or persistence MUST be attributable
        to the current CapabilityRequest and MUST be surfaced in diagnostics.
    - id: REQ-SEC-004
      text: >-
        Production asset acceptance MUST include provenance/license state
        appropriate to the project's distribution model.
    - id: REQ-SEC-005
      text: >-
        Development observability mutation APIs MUST NOT be unintentionally
        exposed in production builds.

  secret_handling:
    source: "Environment variables, OS secret store, or provider-specific secure configuration."
    must_not:
      - "log secrets"
      - "persist secrets in evidence artifacts"
      - "emit secrets in error messages"
      - "commit secrets to game or studio repositories"
      - "send unrelated secrets to provider tools"

  authorization_requirements:
    - "Paid/provider generation requires provider authorization/credential availability."
    - "Open-web asset/reference acquisition must comply with project external-asset policy."
    - "Destructive operations outside generated/declared project paths require explicit user authorization."

reference_algorithms:
  route_capability:
    pseudocode: |-
      function route_capability(request):
        validate(request)
        capability = registry.resolve(request.capability_id)
        if capability is missing:
          return routing_error

        candidates = capability.providers
          .filter(provider => provider.supports(request.inputs, project_policy))
          .filter(provider => provider.preflight_is_eligible())

        if request.preferred_provider is allowed:
          candidates = prefer(request.preferred_provider, candidates)

        selected = choose_by(
          semantic_fit,
          required_representation,
          provenance_policy,
          inspectability,
          project_budget,
          provider_cost,
          availability
        )

        if selected is none:
          return blocked(reason = missing_affordance_or_provider)

        record routing event
        load selected provider instructions
        return selected

  route_asset_construction:
    pseudocode: |-
      function route_asset_construction(asset_need):
        if asset_need.is_specific_depicted_subject:
          if suitable_user_reference_exists:
            return img2threejs
          if approved_project_or_licensed_reference_exists:
            return img2threejs
          return blocked_or_request_reference

        if accepted_project_asset_exists:
          return reuse_asset

        if suitable_allowed_cc0_or_licensed_asset_exists:
          return source_and_normalize

        if simple_procedural_representation_can_meet_requirement:
          return procedural_threejs

        if blender_materially_solves_required_representation:
          record escalation rationale
          return blender

        if project_policy_allows_generic_generation:
          return optional_generator

        return blocked

  verify_observation:
    pseudocode: |-
      function verify_observation(expectation, run):
        required_channels = channels_for(expectation.claim_types)

        for channel in required_channels:
          if run[channel] is missing or stale:
            return incomplete

        semantic = check_semantic_constraints(expectation, run.state)
        visual = check_visual_constraints(expectation, run.pixels)
        telemetry = check_runtime_constraints(expectation, run.telemetry)

        if any required check fails:
          return classify_blockage(expectation, run)

        if expectation.requires_confirmation:
          return pending_confirmation

        return settled

validation_matrix:
  core_conformance:
    - area: "Outcome"
      test: "Create a reference game project and implement one complete playable vertical slice through studio routing."
      expected: "Independently buildable game with fresh accepted evidence."
      evidence: "Reference-game EvidenceManifest and SettlementRecords."

    - area: "Input validation"
      test: "Submit malformed CapabilityRequest and unsafe external paths."
      expected: "Typed rejection before provider execution."
      evidence: "CLI structured error fixtures/tests."

    - area: "Config errors"
      test: "Introduce duplicate Three.js runtime resolution and invalid capability registry entry."
      expected: "compatibility/schema error with scoped blast radius."
      evidence: "`studio doctor --json` output."

    - area: "Startup/preflight"
      test: "Run doctor from a clean checkout with and without optional providers."
      expected: "Core validity distinguished from optional capability availability."
      evidence: "Preflight reports."

    - area: "State transitions"
      test: "Exercise admitted -> executing -> integrated -> verifying -> settled and blocked paths."
      expected: "Only valid transitions occur; evidence remains correlated."
      evidence: "Event log and state-machine tests."

    - area: "Failure handling"
      test: "Inject provider timeout, invalid asset, browser failure, and budget failure."
      expected: "Bounded recovery or typed blocked/failed result without silent degradation."
      evidence: "Fault-injection EvidenceManifests."

    - area: "Observability"
      test: "Drive a deterministic scenario entirely through stable observability hooks."
      expected: "State, named camera, errors, and renderer metrics are readable/reproducible."
      evidence: "Playwright trace + state/telemetry snapshots."

    - area: "Security/safety"
      test: "Attempt secret leakage, path traversal archive, and production debug-hook exposure."
      expected: "All are rejected or absent."
      evidence: "Security test logs/build inspection."

    - area: "Skill routing"
      test: "Evaluate fixed prompts spanning adjacent capabilities."
      expected: "Correct capability selected; routing collisions are reported."
      evidence: "Routing evaluation corpus and results."

    - area: "Asset provenance"
      test: "Import user, CC0/licensed, unknown-provenance, and generated assets."
      expected: "Only allowed/complete provenance states can become accepted production assets."
      evidence: "AssetRecord fixtures and release check."

    - area: "Performance"
      test: "Inject excessive draw calls or frame-time regression into the reference scene."
      expected: "Telemetry gate fails even when visuals remain plausible."
      evidence: "Before/after performance run."

  variation_and_recovery:
    - case: "Reference-image-specific asset vs generic asset prompt."
      why: "Proves img2threejs is not misused as generic generation."
      expected: "Specific depicted subject routes to img2threejs; generic need follows generic asset routing."
      evidence: "Routing tests + provider execution manifests."

    - case: "3dviz scene composition needing terrain and navmesh."
      why: "Proves capability composition instead of monolithic provider ownership."
      expected: "3dviz, terrain, and Recast routes compose while game semantics remain authoritative."
      evidence: "Reference environment run."

    - case: "Blender escalation."
      why: "Proves DCC remains an escape hatch and handoff is explicit."
      expected: "Escalation rationale + derived asset + runtime acceptance."
      evidence: "AssetRecord + Blender adapter run + Needle/runtime capture."

    - case: "Provider unavailable."
      why: "Proves capability semantics survive provider failure."
      expected: "Explicit fallback or blocked state; no hidden downgrade."
      evidence: "Fault-injection run."

    - case: "Visual/semantic disagreement."
      why: "Proves three-channel observation prevents screenshot false success."
      expected: "Contradiction blocks settlement."
      evidence: "Adversarial observation run."

  real_integration_condition: >-
    Any claim involving a browser runtime, Three.js compatibility, provider-generated
    asset, Blender handoff, navigation/physics behavior, or performance requires a
    real non-mock integration on the declared target environment before final conformance.

  real_integration_tests:
    - "Reference image -> img2threejs -> authoritative Three.js runtime -> game -> Gauntlet."
    - "3dviz environment -> terrain where required -> Recast -> Needle/Three runtime -> Gauntlet."
    - "CC0/licensed asset -> registry -> glTF normalization/compression -> runtime -> budget verification."
    - "Blender escalation -> derived GLB/animation/texture -> accepted runtime handoff -> Gauntlet."
    - "Koota state -> render/physics/nav projections -> deterministic browser scenario."
    - "Playwright proof run at required desktop/mobile/browser profiles."

  skipped_test_rule: >-
    Skipped REQUIRED integration tests MUST be reported as skipped, not passed,
    and MUST prevent final conformance when those tests are required.

implementation_definition_of_done:
  - "The studio semantic CLI and `just` façade are both usable from a clean checkout."
  - "Capability registry validates and skill routing collision checks pass."
  - "A game can be created outside the studio repository and builds independently from its lock manifest."
  - "The authoritative Three.js ownership rule is enforced and proven against representative upstream output."
  - "Studio adapters exist and are proven for img2threejs, 3dviz-pro-max, runtime/state/navigation, browser verification, and asset registry."
  - "User-reference image routing to img2threejs is proven end-to-end."
  - "World composition with terrain/navigation composition is proven end-to-end."
  - "At least one CC0/licensed asset source route is proven through normalization and runtime acceptance."
  - "Blender escalation is proven without making Blender authoritative."
  - "The observability bridge exposes deterministic state, camera/scenario, errors, and telemetry in development/test builds and is absent/restricted in production."
  - "Gauntlet can consume fresh state + pixel + telemetry evidence and distinguish contradictory channels."
  - "Failed/contradictory evidence is retained and traceable."
  - "Variation and recovery cases applicable to the target reference game pass."
  - "Security/trust-boundary tests pass."
  - "Claim levels match actual evidence."
  - "A cold developer or agent can answer every quality-gate question in spec_frame from this file alone."

roadmap_boundaries:
  additional_content_providers:
    level: "roadmap"
    future_shape: >-
      Additional audio, voice, animation, material, image, model, and world
      providers may register against existing or new stable capabilities.
    current_requirement: >-
      Capability/provider registry and AssetRecord must preserve replaceability;
      no current conformance requires a specific future provider.

  webgpu_ultra_profile:
    level: "roadmap"
    future_shape: >-
      WebGPU/TSL-heavy quality profile with advanced compute/post effects where
      the selected runtime proves compatibility and performance.
    current_requirement: >-
      Runtime/quality-profile abstraction must not assume WebGL-only behavior
      beyond current provider constraints.

  multiplayer_services:
    level: "roadmap"
    future_shape: "Authoritative or peer/networked game services behind explicit capabilities."
    current_requirement: "Do not bake networking provider assumptions into core domain entities."

  adaptive_routing_from_evidence:
    level: "roadmap"
    future_shape: >-
      Routing policy may use accumulated evidence to rank providers/representations
      for similar future requests.
    current_requirement: >-
      Current routing must be deterministic/reviewable and must not claim autonomous
      learning from historical success.

  additional_dcc_tools:
    level: "roadmap"
    future_shape: "Other offline DCC/tool providers could register beside Blender."
    current_requirement: "Blender escalation must already sit behind a stable DCC capability boundary."

  unity_integration:
    level: "roadmap"
    future_shape: "No planned support."
    current_requirement: "Unity remains out of scope; Needle's Unity integration does not create a studio requirement."

conformance_traceability:
  high_risk_requirement_groups:
    - group: "Runtime compatibility and authority"
      requirements:
        - "REQ-CONFIG-004"
        - "REQ-RUNTIME-001"
        - "REQ-RUNTIME-004"
        - "REQ-BIND-001"
      confirmation: "fresh_target_reproduction"

    - group: "Reference-image reconstruction routing"
      requirements:
        - "REQ-BIND-006"
        - "REQ-ASSET-001"
        - "REQ-ASSET-002"
        - "REQ-ASSET-004"
      confirmation: "independent"

    - group: "Observability and Gauntlet settlement"
      requirements:
        - "REQ-OBS-001"
        - "REQ-OBS-002"
        - "REQ-GAUNTLET-002"
        - "REQ-GAUNTLET-003"
        - "REQ-GAUNTLET-006"
      confirmation: "adversarial"

    - group: "Asset provenance and production acceptance"
      requirements:
        - "REQ-ASSET-003"
        - "REQ-ASSET-006"
        - "REQ-SEC-004"
      confirmation: "peer"

    - group: "Blender escalation boundary"
      requirements:
        - "REQ-BLENDER-001"
        - "REQ-BLENDER-002"
        - "REQ-BLENDER-004"
        - "REQ-BLENDER-005"
      confirmation: "independent"

    - group: "Performance settlement"
      requirements:
        - "REQ-PERF-001"
        - "REQ-PERF-002"
        - "REQ-PERF-003"
        - "REQ-PERF-004"
      confirmation: "fresh_target_reproduction"

    - group: "Provider fallback semantics"
      requirements:
        - "REQ-ROUTE-005"
        - "REQ-ROUTE-006"
        - "REQ-SAFE-002"
      confirmation: "adversarial"

  plan_projection_rule: >-
    Every REQUIRED normative requirement MUST map to at least one implementation
    plan task. Every settlement-critical task MUST declare the requirement IDs it
    settles, its proof level, evidence location, and confirmation mode. A
    requirement without a plan task or settled evidence remains open.
