environment_blockers:
  T18:
    blocker: blender_unavailable
    detail: >-
      T18 requires the Blender executable to produce the service-drone retarget/bake derivative
      (REQ-BLENDER-*). Blender is not installed on this host (which blender exits 1). The task's own design
      makes missing Blender a scoped regeneration/proof blockage while deterministic CI stays green;
      execution resumes when Blender is installed (or the derivative is produced on a donor host through the
      dcc.blender.process route and committed with regeneration metadata). T22/T23/T24/T25 remain gated
      behind it.

