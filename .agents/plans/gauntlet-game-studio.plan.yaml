      high-risk requirement group.
    proves: The implementation conforms to the frozen normative spec at the evidence level actually claimed, with zero 
      unmapped REQUIRED requirements and no hidden dependency on donor source, model generation, Blender for normal 
      builds, or builder assertion.
    does_not_prove: Roadmap capabilities or guarantees beyond the frozen specification.
