      ├── artifacts/
      │   └── runs/
      └── .tmp/
          └── donor/   # gitignored, disposable, never authoritative
  adapter_matrix:
    - id: agent-skill.img2threejs
      kind: agent_skill
      owner: packages/adapters/src/agent-skills/img2threejs
      role: Reference-image reconstruction handoff; interactive generation only, deterministic accepted-result 
        verification in CI.
    - id: agent-skill.3dviz
      kind: agent_skill
      owner: packages/adapters/src/agent-skills/3dviz
      role: Environment/world composition handoff; composes with terrain/nav rather than owning them.
    - id: agent-skill.threejs-game-skills
      kind: agent_skill_overlay
      owner: packages/adapters/src/agent-skills/threejs-game-skills
      role: Selected gameplay/graphics/UI/debug/QA specialists; studio director remains sole orchestration authority.
    - id: terrain.heightfield
      kind: procedural_generator
      owner: packages/runtime/src/terrain
      role: Deterministic mathematical elevation generation directly into canonical TerrainHeightfield; downstream 
        render/physics/nav derive from canonical samples.
    - id: physics.rapier
      kind: package
      owner: packages/runtime/src/physics
      role: Preferred 3D physics simulation engine via @dimforge/rapier3d-compat (WASM, async init, stepped by single 
        runtime scheduler, execution projection).
    - id: navigation.recast
      kind: package
      owner: packages/runtime/src/navigation
      role: Navmesh/path/crowd projection over accepted world geometry.
    - id: spatial.three-mesh-bvh
      kind: package
      owner: packages/runtime/src/spatial
      role: Accelerated raycast/LOS/spatial queries without semantic authority.
    - id: asset.gltf-transform
      kind: package
      owner: packages/adapters/src/assets/gltf-transform
      role: Offline glTF normalization, pruning, compression, and runtime preparation.
    - id: asset.polyhaven
      kind: http_source
      owner: packages/adapters/src/assets/polyhaven
      role: Initial CC0/HDRI/PBR source adapter with provenance capture.
    - id: vfx.quarks
      kind: package
      owner: packages/adapters/src/vfx/quarks
      role: Three-native inspectable VFX projection.
    - id: audio.tone
      kind: package
      owner: packages/adapters/src/audio/tone
      role: Browser procedural audio backend implementing AudioBackend; real gesture unlock required.
    - id: audio.null
      kind: runtime_null
      owner: packages/runtime/src/audio
      role: Headless/server/test NullAudioBackend implementing AudioBackend; zero Web Audio/Tone.js dependencies.
    - id: dcc.blender
      kind: cli_dcc
      owner: packages/adapters/src/dcc/blender
      role: Isolated regeneration/escalation to standard committed GLB/glTF derivatives.
    - id: browser.agent-browser
      kind: agent_tool
      owner: packages/adapters/src/browser/agent-browser
      role: Exploratory browser inspection/debug only; never sole settlement oracle.
    - id: browser.playwright
      kind: browser_proof
      owner: packages/adapters/src/browser/playwright
      role: Deterministic browser scenarios, traces, screenshots, and proof.
    - id: network.websocket
      kind: transport
      owner: packages/runtime/src/network/transports/websocket
      role: Baseline Bun native WebSocket transport implementation behind studio-owned transport abstraction.
    - id: network.geckos
      kind: transport
      owner: packages/runtime/src/network/transports/geckos
      role: Optional WebRTC/UDP-like datagram transport binding behind studio-owned transport abstraction; requires 
        explicit capability selection and must not block baseline builds.
  donor_strategy:
    path: .tmp/donor/
    relationship: code_donor_only
    rules:
      - Do not add donor source to workspaces, package dependencies, runtime resolution, or generated games.
      - Design Gauntlet Runtime module/contract first; consult donor only after the owning task has a defined 
        affordance.
      - Classify each consulted donor mechanism as transplant, rewrite_from_concept, discard, or not_needed.
      - Retain legally required MIT attribution/provenance for materially copied/transplanted code in 
        `third_party/mavon-engine/`.
      - Public APIs/logs/docs are Gauntlet Runtime; no donor branding or compatibility promises.
      - Fresh checkout without `.tmp/donor/` is a mandatory conformance condition.
  threejs_game_skills_policy:
    overlay:
      - threejs-gameplay-systems
      - threejs-aaa-graphics-builder
      - threejs-game-ui-designer
      - threejs-debug-profiler
      - threejs-qa-release
    not_orchestration_authority:
      - threejs-game-director
    quarantined_optional_fallbacks:
      - threejs-3d-generator
      - threejs-image-generator
      - threejs-audio-generator
    fork_rule: Only an individual specialist may be copied into `skills/vendor-overrides/` after external 
      overlay/configuration is proven insufficient.
  reference_game:
    name: Blackwater Relay
    purpose: Production-shaped conformance vertical slice, not the studio product.
    premise: A storm-dusk island relay outpost where a player traverses by rover, recovers a power cell, opens the relay
      gate, interacts with a reference-reconstructed field transceiver, encounters a patrolling service drone, and 
      activates the beacon.
    required_routes:
      - 3dviz environment composition
      - canonical seeded terrain
      - img2threejs field-transceiver reconstruction
      - approved CC0/licensed PBR/HDRI intake
      - Koota semantic state
      - standard Three.js rendering
      - direct Rapier physics
      - Recast navigation
      - three-mesh-bvh spatial queries
      - Quarks VFX
      - Tone audio through AudioBackend
      - DOM/CSS HUD
      - one justified Blender service-drone retarget/bake derivative
      - glTF-Transform optimization
      - agent-browser exploration
      - Playwright deterministic proof
      - optional two-client authoritative networking over headless Bun server
    single_player_scenarios:
      - boot
      - active-play
      - transceiver-interaction
      - patrol-obstacle
      - beacon-activation
      - performance-flythrough
    multiplayer_scenarios:
      - multiplayer-sync
      - interest-filtering
      - multiplayer-latency
verification:
  global_gates:
    - id: G-CHECK
      command: just check
    - id: G-TEST
      command: just test
    - id: G-LINT
      command: just lint
    - id: G-AGENT-ARTIFACTS
      command: just validate-agent-artifacts
  gate_binding_rule: T00 creates/binds these aliases to the repository's real commands. Later tasks extend underlying 
    test suites rather than introducing duplicate global command surfaces. A task runs only global gates applicable to 
    the implementation state reached so far; missing future capability commands are not treated as passed.
  proof_levels:
    P0: Mechanical/deterministic change. Requires a narrow direct gate plus applicable global gates.
    P1: Normal behavioral work. Requires positive behavior, a meaningful teeth/falsification check, and applicable 
      global gates.
    P2: Invariant-sensitive work. Requires an explicit/preregistered claim, adversarial/negative evidence, evidence 
      artifact, applicable global gates, and review of a plausible alternate failure path.
    P3: Settlement-critical work. Requires frozen preregistration, builder evidence, explicit adversarial attacks, fresh
      independent confirmation, and correction/re-confirmation after any failed confirmation.
