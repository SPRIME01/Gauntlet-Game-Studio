      - .agents/specs/gauntlet-game-studio.spec.yaml
      - .agents/plans/gauntlet-game-studio.plan.yaml
      - .agents/CURRENT_STATUS.yml
      - artifacts/runs/
    steps:
      - Mechanically parse the frozen spec requirement IDs and plan task mappings; require zero unmapped and zero 
        unknown IDs.
      - Run a fresh install/check/test/build/doctor from clean checkout with `.tmp/donor/` absent.
      - Run Blackwater single-player and multiplayer conformance suites and validate all referenced EvidenceManifests.
      - Run final `studio evidence check`/settlement index and ensure failed/correction evidence remains preserved.
      - Give an independent verifier the frozen spec requirements, governing invariants, relevant implementation, fresh 
        evidence, and exact confirmation questions for all high-risk groups; do not substitute builder summary.
      - Update `.agents/CURRENT_STATUS.yml` and handoff only after the independent verdicts pass.
    gate:
      - python3 scripts/check-traceability.py .agents/plans/gauntlet-game-studio.plan.yaml 
        .agents/specs/gauntlet-game-studio.spec.yaml
      - just ci
      - bun run studio -- verify --project examples/blackwater-relay --suite all --json
    teeth:
      - attack: Remove one requirement mapping from a temporary plan copy.
        expected: Traceability gate reports the exact unmapped requirement and fails.
      - attack: Replace fresh final evidence with historical passing run IDs from another revision.
        expected: Evidence freshness gate rejects final conformance.
    redesign_trigger: If independent confirmation discovers a representation-level flaw, reopen the earliest task that 
      owns that representation and repeat downstream confirmation; do not patch the final report.
    evidence: artifacts/plan/T25/
    done_when:
