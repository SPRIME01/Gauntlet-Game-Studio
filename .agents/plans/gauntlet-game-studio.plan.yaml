tasks:
  T00:
    title: Freeze governing source and bootstrap settlement infrastructure
    initial_status: ready
    depends_on: []
    proof_level: P1
    confirmation: builder
    settles: []
    changes: Binds execution to an approved/frozen specification revision and creates only the minimal repository-local 
      machinery required for plan validation, preregistration, evidence, decisions, and stable global gates.
    proves: The repository can determine whether work is authorized to start, validate spec/plan paths, preserve mutable
      status separately, and execute stable global gate aliases without relying on nonexistent future scripts.
    does_not_prove: No studio capability, runtime behavior, provider integration, or reference-game functionality.
    hot_context:
      - AGENTS.md
      - .agents/CURRENT_STATUS.yml
      - .agents/specs/gauntlet-game-studio.spec.yaml
      - .agents/plans/gauntlet-game-studio.plan.yaml
    steps:
      - 'Do not execute implementation while the source spec declares `metadata.status: draft`; once the exact content is
        approved/frozen, update the spec status, recompute SHA-256, and rebind this plan before any implementation task.'
      - Validate `AGENTS.md`, `.agents/CURRENT_STATUS.yml`, `.agents/specs/`, and `.agents/plans/` as the authoritative 
        artifact paths; remove any competing root `specs/` or `plans/` assumptions.
      - Create `.agents/preregistrations/`, `.agents/decisions/`, `.agents/reports/`, and the plan evidence root if 
        absent.
      - Create the minimal plan/source validation and traceability scripts used by later gates; these scripts must 
        inspect real files rather than hard-coded expected counts.
      - Create/bind `just` aliases for global check, test, lint, and agent-artifact validation; later tasks extend the 
        commands without creating competing gate surfaces.
      - Verify `.tmp/` is gitignored and `.tmp/donor/` is explicitly non-authoritative.
    gate:
      - test -f AGENTS.md && test -f .agents/CURRENT_STATUS.yml
      - git check-ignore .tmp/donor
      - just validate-agent-artifacts
    teeth:
      - attack: Point plan/spec validation at root `specs/` or `plans/` paths.
        expected: Validation fails and reports the `.agents/` authoritative paths.
      - attack: Set source status back to `draft` while attempting execution authorization.
        expected: Execution authorization remains blocked; implementation tasks are not marked ready.
    redesign_trigger: If the existing repository has a different explicit authority convention that is already relied on
      by tooling, stop and reconcile that convention with the governing spec rather than creating duplicate state trees.
    evidence: artifacts/plan/T00/
    done_when:
      - The narrow gate exits 0.
      - The declared teeth/falsification checks behave as specified.
      - All applicable global gates remain green.
      - The source is approved/frozen and this plan is rebound to its exact SHA before T01 becomes ready.
  T01:
    title: Establish lean Bun monorepo topology and source boundaries
    initial_status: blocked
    depends_on: *id001
    proof_level: P1
    confirmation: builder_with_teeth
    settles:
      - REQ-CONFIG-007
      - REQ-CONFIG-008
      - REQ-CONFIG-009
      - REQ-BIND-014
      - REQ-REPO-001
      - REQ-REPO-004
      - REQ-REPO-005
      - REQ-SOURCE-001
      - REQ-SOURCE-002
      - REQ-SOURCE-003
      - REQ-SOURCE-004
    changes: Creates the minimum workspace topology, Bun 1.4 package/script baseline, gitignore/source boundaries, and 
      dependency policy without exploding every adapter into an independent package.
    proves: The repository has a coherent first-party structure whose package boundaries correspond to real 
      lifecycle/reuse boundaries and whose normal operations never depend on `.tmp/donor/`.
    does_not_prove: That the runtime, router, adapters, or generated games behave correctly.
    hot_context:
      - .agents/specs/gauntlet-game-studio.spec.yaml#configuration_and_input_contract
      - .gitignore
      - .tmp/donor/
    steps:
      - Create root `package.json`, Bun lockfile/workspaces, TypeScript/lint/test configuration, and `justfile` under 
        the Bun 1.4 baseline.
      - 'Use the planned five primary code boundaries: `packages/contracts`, `packages/studio`, `packages/runtime`, `packages/adapters`,
        and `apps/studio-cli`; keep adapters as modules inside `packages/adapters` until independent lifecycle/reuse is proven.'
      - Create `capabilities/`, `skills/`, `vendor/`, `templates/game/`, `examples/blackwater-relay/`, `third_party/`, 
        `scripts/`, and `artifacts/` only where required by this plan.
