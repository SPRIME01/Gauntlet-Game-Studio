      - The declared teeth/falsification checks behave as specified.
      - All applicable global gates remain green.
      - Every high-risk group has its spec-declared fresh confirmation mode and the handoff next action is `none — plan 
        settled`.
    preregistration:
      required: true
      artifact: .agents/preregistrations/gauntlet-game-studio-plan-T25.prereg.yaml
      claims:
