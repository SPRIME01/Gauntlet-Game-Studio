schema: agent.development_plan
schema_version: '1.0'
metadata:
  id: gauntlet-game-studio-plan
  title: Gauntlet Game Studio Development Settlement Plan
  status: approved
  version: 0.2.0
  created: '2026-09-15'
  purpose: Project the revised Gauntlet Game Studio normative specification into an executable settlement graph that 
    builds a first-party Bun/Three.js/Koota/Rapier runtime, strategically mines Mavon only as disposable donor source, 
    integrates specialist game-production capabilities, proves optional authoritative multiplayer, and settles the 
    studio through Blackwater Relay plus fresh adversarial evidence.
source:
  spec:
    intended_repository_path: .agents/specs/gauntlet-game-studio.spec.yaml
    artifact_name: gauntlet-game-studio.spec.yaml
    spec_id: gauntlet-game-studio
    spec_version: 0.2.0
    sha256: 595c1f56f1f59e8f59d93d6e19f857635a98ca3418504dc861ca6a7f149d9e7e
    authority: normative
    freeze_note: The bound source specification is approved and frozen at metadata.status=approved with SHA-256 
      595c1f56f1f59e8f59d93d6e19f857635a98ca3418504dc861ca6a7f149d9e7e. T00 is ready for execution bootstrap.
  supporting_sources:
    - path: AGENTS.md
      role: Durable agent operating contract; governs execution behavior but does not override normative desired state.
    - path: .agents/reports/agentic-threejs-game-studio-adversarial-analysis.md
      role: Non-normative adversarial findings that motivated the v0.2 spec corrections; useful regression context.
    - path: .tmp/donor/
      role: Temporary gitignored implementation donor workspace. Non-authoritative, optional, disposable, and forbidden 
        as runtime/build dependency.
target_settlement: A clean checkout under Bun 1.4 can generate independent game projects, route requirements through 
  stable capabilities, run a first-party Gauntlet Runtime with standard Three.js, Koota authority, direct Rapier, 
  Recast, BVH, audio/VFX/content adapters, Bun native WebSocket baseline networking, and optional server-authoritative 
  WebRTC multiplayer; deterministic CI verifies committed agent-assisted outputs without model credentials; normal builds 
  do not require Blender, toktx, WebRTC/geckos, or donor source; Blackwater Relay proves the integrated single-player 
  and two-client multiplayer paths; state, pixels, telemetry, network evidence, provenance, recovery cases, and fresh 
  independent confirmations support every REQUIRED claim.
operating_contract:
  core_principle: Gauntlet contracts and semantic authority determine the architecture; donor/provider code may fill a 
    defined affordance but MUST NOT determine module boundaries, semantic authority, orchestration, or proof.
  rules:
    - Execute tasks by dependency, not by narrative order.
    - Independent tasks MAY run in parallel only after all declared dependencies are settled.
    - Every task MUST leave the repository in a coherent state with all applicable global gates green.
    - A task is not complete because code exists, a process starts once, the builder reports success, or a happy-path 
      test passes.
    - A passing gate proves only what that gate actually observes.
    - High-risk P3 work requires fresh independent/adversarial confirmation.
    - Do not generalize from one observation unless the normative requirement is itself general.
    - Do not silently widen domain, schema, API, config, service, or authority surfaces when an existing representation 
      can preserve the required distinction.
    - Runtime/machine/provider-specific facts belong in the project's established config/secret hierarchy rather than 
      scattered hardcoding.
    - Preserve failed evidence and correction history.
    - Design first-party Gauntlet Runtime modules before consulting `.tmp/donor/`; transplant only requirement-serving 
      mechanisms into those established boundaries.
    - Koota is semantic authority; Three.js, Rapier, Recast, network state, audio/VFX, Blender, and asset/provider 
      representations are projections or production artifacts.
    - Required CI MUST remain deterministic and credential-independent for agent-skill generation; live model runs are 
      development/regression activities, not deterministic proof.
    - Normal game build/test/runtime MUST remain independent of `.tmp/donor/` and Blender.
  claim_states:
    - OBSERVED
    - INFERRED
    - DECIDED
    - ASSUMED
    - UNKNOWN
  correction_protocol:
    - Preserve the failed evidence.
    - 'Classify the failure: implementation, oracle/test, representation, missing prerequisite, environmental confound, or
      source-spec ambiguity.'
    - Determine whether the governing requirement/invariant remains valid.
    - Correct the smallest falsified layer.
    - Rerun the original teeth/falsification check.
    - Rerun the original confirmation path.
    - Append the correction round; do not erase the failed round.
    - Do not weaken acceptance merely because the implementation repeatedly fails it.
  scope_control: A newly discovered issue enters the current plan only when it blocks a normative requirement or is 
    itself required by the source specification. Valuable but independent discoveries become future debt/plans. 
    Attractive architecture with no requirement is rejected from current scope.
artifacts:
  current_status: .agents/CURRENT_STATUS.yml
  decision_log: .agents/decisions/game-studio.jsonl
  evidence_root: artifacts/plan/
  reports_root: .agents/reports/
  preregistration_root: .agents/preregistrations/
  status_rule: Mutable current status is an operational projection and MUST NOT become a source of desired-state or 
    normative authority.
