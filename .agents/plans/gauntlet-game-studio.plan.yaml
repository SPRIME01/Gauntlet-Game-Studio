          unmapped REQUIRED requirements and no hidden dependency on donor source, model generation, Blender for normal 
          builds, or builder assertion.
      falsifiers:
        - Remove one requirement mapping from a temporary plan copy.
        - Replace fresh final evidence with historical passing run IDs from another revision.
      known_confounds:
        - Stale evidence or a different project revision.
        - Unavailable optional provider/tool being mistaken for core capability failure.
      confirmation_condition: The declared task gates and teeth pass using fresh evidence for the current revision, and 
        the task's declared confirmation mode is satisfied.
    independent_confirmation:
      verifier_receives:
        - source requirement(s)
        - frozen preregistration
        - relevant implementation
        - fresh task evidence
        - exact confirmation question
      verifier_should_not_receive:
        - builder conclusion as authority; it may be available only as non-authoritative context after the verifier 
          forms an evidence-based judgment
      required_verdict: CONFIRM
final_acceptance:
  studio_and_repository:
    - A clean checkout under Bun 1.4 passes global gates and `studio doctor` with `.tmp/donor/` absent.
    - Generated games are independent projects with project-local spec, lock, Asset Registry, tests, `.agents/`, and 
      evidence roots.
    - Capability descriptions/routing and skill overlays have no unresolved collision or competing director authority.
  runtime_authority:
    - Gauntlet Runtime is first-party, standard-Three.js-native, Koota-authoritative, headless-capable, and exposes one 
      deterministic simulation scheduler/one Rapier step.
    - Rapier/Recast/network asynchronous readiness cannot race scenario execution.
    - Terrain render, collision, and navigation derive from one canonical TerrainHeightfield and pass asymmetric parity 
      tests.
  donor_and_provenance:
    - Mavon is absent as a dependency, public identity, semantic authority, compatibility target, or required checkout.
    - Material donor transplants retain required MIT attribution/provenance while normal clean-checkout build/test/proof
      succeeds without donor files.
    - Production assets have accepted AssetRecords and allowed provenance/license state.
  content_and_tools:
    - img2threejs and 3dviz use explicit interactive AgentHandoffs while deterministic CI verifies committed accepted 
      results with no model credentials.
    - Blender is isolated to regeneration/proof and normal build/runtime consumes committed accepted derivatives without
      Blender.
    - Audio obeys real browser gesture policy and headless logic does not require AudioContext.
  networking:
    - Single-player requires no server/transport.
    - Two local clients against the headless authoritative server pass nominal and impaired-latency scenarios, relevance
      filtering, reconciliation, disconnect, and untrusted-client tests.
  proof_and_quality:
    - Required claims use fresh state, pixels, telemetry, and network evidence as applicable; contradictory channels 
      prevent settlement.
    - Performance profiles fail on deliberate regressions despite plausible visuals/semantics.
    - All applicable VAR and RECOV cases pass without erasing failed/correction evidence.
  evidence_and_confirmation:
    - Every REQUIRED normative spec requirement maps to at least one settled task/evidence record.
    - Every P3 task has the required fresh independent confirmation.
    - Failed/correction evidence has not been erased.
    - Documentation/status claims do not exceed observed proof.
    - All global gates exit 0.
    - Final independent verifier confirms every high-risk requirement group using fresh clean-checkout/reference-game 
      evidence.
guardrails:
  - Do not reintroduce Needle or another third-party game engine as runtime authority without an explicit normative spec
    revision.
  - Do not let donor source, donor entity architecture, or donor branding enter authoritative/public runtime contracts.
  - Koota owns game semantics; Three.js/Rapier/Recast/network/audio/VFX/DCC representations are projections or 
    artifacts.
  - Exactly one standard Three.js graph and exactly one authoritative simulation scheduler/Rapier step exist per world.
  - Agent-skill development generation is distinct from deterministic CI verification.
  - Blender and `.tmp/donor/` are optional production/development inputs, never normal build/runtime dependencies.
  - Provider failure, unavailable tools, skipped browser proof, stale evidence, and network disconnect remain visible 
    blocked/failed states.
  - Failed evidence and correction history are append-preserved.
  - Unity integration, proprietary engine dependency, generic paid generation by default, and unearned package 
    proliferation remain out of scope.
handoff_contract:
  must_report:
    - settled capabilities/requirements
    - explicitly unsettled or deferred items
    - current operational system state
    - requirement-to-evidence index
    - known limitations
    - rollback/recovery instructions where relevant
    - important decisions/discoveries that changed the execution model
    - exact next executable action or 'none — plan settled'
  settled_next_action_rule: The next executable action MUST be set to `none — plan settled` only after the final 
    required conformance/confirmation task succeeds.
