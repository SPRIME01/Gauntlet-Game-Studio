    - Verify eligible equivalent fallback is explicit and semantically equivalent; otherwise result is blocked/degraded.
    - Verify unrelated accepted assets/evidence/project state remain unchanged after provider failures.
    - Run fixed adversarial routing corpus after all provider integrations.
    gate:
    - just test-recovery-matrix
    - just test-security
    - studio verify --project examples/blackwater-relay --profile recovery --json
    teeth:
    - attack: Unset optional paid-provider credentials and request a capability satisfiable procedurally/CC0.
      expected: Studio uses allowed preferred route or explicit fallback; no hidden downgrade.
    - attack: Inject a provider timeout during asset generation.
      expected: No unrelated registry/evidence corruption; bounded retry/fallback/block.
    - attack: Seed a fake API key into environment then scan browser bundle/evidence/logs.
      expected: Secret never appears.
    independent_confirmation:
      verifier_receives:
      - recovery matrix
      - security requirements
      - integrated studio
      - fault injection commands
      - evidence
      verifier_should_not_receive:
      - builder's expected internal implementation path
      required_verdict: CONFIRM
    redesign_trigger: If failures routinely cross adapter boundaries or corrupt shared mutable state, stop final
      confirmation and redesign isolation/transaction boundaries rather than adding cleanup scripts.
    evidence: artifacts/runs/plan/T20/
    done_when:
    - All required recovery cases produce expected scoped outcomes.
    - Secrets/provenance/traversal tests pass.
    - Fallback semantics are explicit.
    - Fresh independent adversarial verifier reproduces high-risk cases.
    - Applicable global gates pass.
