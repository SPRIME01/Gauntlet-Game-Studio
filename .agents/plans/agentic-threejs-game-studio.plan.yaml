tasks:
  T00:
    title: Freeze source, scaffold monorepo, and bind repository topology
    initial_status: ready
    depends_on: []
    proof_level: P1
    confirmation: builder
    settles:
    - REQ-GOAL-006
    - REQ-SOURCE-001
    - REQ-SOURCE-002
    - REQ-SOURCE-003
    - REQ-REPO-001
    - REQ-REPO-003
    changes: Create the studio monorepo skeleton, bind the source specification SHA, establish pnpm + TypeScript
      + just conventions, create the evidence/state roots, and add only the three agent-facing upstream repositories
      as pinned submodules.
    proves: The repository shape can preserve upstream ownership while giving the studio one coherent place for
      contracts, adapters, skills, tests, evidence tooling, and a reference game.
    does_not_prove: This does not prove any provider works in the runtime, that routing is correct, or that a generated
      game can build independently.
    steps:
    - Create pnpm-workspace.yaml, package.json, tsconfig base, justfile, specs/, plans/, packages/, skills/, vendor/,
      templates/, examples/, .agents/, and artifacts/.
    - Copy/bind the frozen spec to specs/agentic-threejs-game-studio.spec.yaml and record SHA-256 in this plan/current
      status.
    - 'Add git submodules: vendor/img2threejs -> img2threejs/img2threejs; vendor/3dviz-pro-max -> viettranx/3dviz-pro-max;
      vendor/threejs-game-skills -> majidmanzarpour/threejs-game-skills.'
    - Do not vendor runtime libraries; reserve them for normal package dependencies.
    - Create .agents/state/current-status.yaml and append-only .agents/decisions/game-studio.jsonl.
    - Create stable just aliases for check/test/lint/studio-doctor that may initially fail until later tasks bind
      implementations.
    gate:
    - test -f pnpm-workspace.yaml && test -f justfile
    - git submodule status
    - python3 scripts/verify-plan-source.py
    teeth:
    - attack: Replace a submodule pin with an untracked floating checkout.
      expected: Topology/source validation fails.
    - attack: Add a runtime library repository under vendor/ without an approved exception.
      expected: Repository-policy lint fails.
    redesign_trigger: If one or more agent-facing upstreams cannot be consumed from a pinned submodule without contaminating
      normal project dependency resolution, stop and redesign vendor isolation rather than copying entire repositories
      into packages/.
    evidence: artifacts/runs/plan/T00/
    done_when:
    - Repository topology exists exactly as declared.
    - Source spec hash matches this plan.
    - Submodules are pinned and runtime libraries are not vendored.
    - Applicable bootstrap gates pass.
  T01:
    title: Implement studio contracts, schemas, and authority model
    initial_status: blocked
    depends_on: *id001
    proof_level: P2
    confirmation: builder_with_teeth
    settles:
    - REQ-GOAL-003
    - REQ-OUT-005
    - REQ-CONFIG-001
    - REQ-CONFIG-002
    - REQ-CONFIG-005
    changes: Create the canonical TypeScript/Zod representations for capability routing, normalized results, assets,
      observation runs, evidence, settlement, project configuration, and stable IDs.
    proves: Provider-specific data can be admitted and normalized without allowing render/DCC/provider objects to
      become authoritative studio/game semantics.
    does_not_prove: This does not prove runtime integration, provider behavior, or any game outcome.
    preregistration:
      required: true
      artifact: .agents/preregistrations/agentic-threejs-game-studio-T01.prereg.yaml
      claim: The smallest stable studio domain model can normalize provider work without making provider/runtime
        representations authoritative.
      falsifier: A required normative flow cannot be represented without storing provider-specific authority in
        a stable entity.
      known_confounds:
      - Prematurely adding fields solely because a current vendor exposes them.
      confirmation_condition: All required flows serialize through provider-neutral schemas and the authority-leak
        teeth tests reject violations.
    steps:
    - Create packages/contracts with Zod schemas and inferred TypeScript types for CapabilityDescriptor, CapabilityRequest,
      CapabilityResult, AssetRecord, ObservationRun, EvidenceManifest, SettlementRecord, StudioResult, and ProjectConfig.
    - Encode ID/path normalization, project-relative evidence paths, claim/result enums, and explicit provider/fallback
      fields.
    - Define correlation interfaces for game entity -> render/physics/nav/audio projections without depending on
      specific providers.
    - Add serialization round-trip and invalid-input tests.
    - Document source-of-authority boundaries next to the schemas, not in provider adapters.
    gate:
    - pnpm --filter @studio/contracts test
    - pnpm --filter @studio/contracts check
    teeth:
    - attack: Deserialize a CapabilityResult that claims success but omits provider identity or request correlation.
      expected: Schema rejects it.
    - attack: Place a THREE.Object3D, Rapier body, or Blender object as authoritative game-state payload.
      expected: Contract tests reject provider/runtime object leakage across the stable boundary.
    redesign_trigger: If the schemas require more than the seven stable domain objects plus configuration/result
      envelopes to express normal flow, reassess whether implementation nouns are leaking into the domain model.
    evidence: artifacts/runs/plan/T01/
    done_when:
    - Every stable spec entity has one schema and round-trip test.
    - Invalid authority/correlation cases fail.
    - Applicable global gates pass.
  T02:
    title: Implement semantic studio CLI, just facade, config preflight, and doctor
    initial_status: blocked
    depends_on: *id002
    proof_level: P1
    confirmation: builder
    settles:
    - REQ-CONFIG-010
    - REQ-CONFIG-011
    - REQ-CONFIG-012
    - REQ-CLI-001
    - REQ-CLI-002
    - REQ-CLI-003
    - REQ-CLI-004
    - REQ-CLI-005
    - REQ-SAFE-004
    changes: Create the lightweight TypeScript semantic CLI and bind just recipes to it, including structured JSON
      results, stable exit codes, config validation, and project/studio doctor checks.
    proves: Agents and humans have one stable semantic command surface while just remains only an ergonomic recipe
      layer.
    does_not_prove: This does not prove routing, external providers, runtime compatibility, or game verification.
    steps:
