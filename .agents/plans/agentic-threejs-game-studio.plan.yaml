schema: agent.development_plan
schema_version: '1.0'
metadata:
  id: agentic-threejs-game-studio-plan
  title: Agentic Three.js Game Studio Development Settlement Plan
  status: draft
  version: 0.1.0
  created: '2026-09-15'
  purpose: Project the Agentic Three.js Game Studio normative specification into an executable settlement graph
    that establishes repository topology, capability routing, provider adapters, independent game creation, Blackwater
    Relay as the first reference game, three-channel Gauntlet verification, and final independently confirmed conformance.
source:
  spec:
    intended_repository_path: specs/agentic-threejs-game-studio.spec.yaml
    artifact_name: agentic-threejs-game-studio.spec.yaml
    spec_id: agentic-threejs-game-studio
    spec_version: 0.1.0
    sha256: bcbe76828748ee9d2e0212584ce2fe3a628c231934e765873570bfca599000d9
    authority: normative
    freeze_note: The source artifact currently declares metadata.status=draft. This plan is therefore draft even
      though it is bound to an exact SHA. Before execution, mark that exact normative content approved/frozen or
      regenerate the plan if any semantic byte changes.
  supporting_sources:
  - path: AGENT_PLAN_TEMPLATE.yaml
    role: Plan structure and settlement-task authoring rules; non-normative to product behavior.
  - path: vendor/img2threejs/SKILL.md
    role: Current reference-image reconstruction provider instructions once T00 vendors the pinned repo.
  - path: vendor/3dviz-pro-max/skills/3dviz-pro-max/SKILL.md
    role: Current environment-composition provider instructions once T00 vendors the pinned repo.
  - path: vendor/threejs-game-skills/skills/
    role: Current game specialist guidance reused under the studio routing overlay.
target_settlement: A cold coding agent can create a game outside the studio repository, identify a stable capability
  before selecting a provider, progressively load only the selected specialist instructions, produce/reference/source
  assets with provenance and runtime budgets, integrate them into a single-Three Needle/Koota/Rapier/Recast runtime,
  inspect the running game through a stable observability bridge, and settle requirements through fresh state +
  pixel + telemetry evidence. Blackwater Relay reproduces the full workflow from a clean checkout, failure/recovery
  cases are adversarially proven, and every REQUIRED source requirement maps to settled evidence and its required
  confirmation.
operating_contract:
  core_principle: 'Integrate through stable affordances and evidence, not source-code ownership: the studio owns
    contracts, routing, provenance, observability, and settlement; upstream tools own their specialist implementation.'
  rules:
  - Execute tasks by dependency, not by narrative order.
  - Independent tasks MAY run in parallel only after all declared dependencies are settled.
  - Every task MUST leave the repository in a coherent state with all applicable global gates green.
  - A task is not complete because code exists, a process starts once, the builder reports success, or a happy-path
    test passes.
  - A passing gate proves only what that gate actually observes.
  - High-risk P3 work requires fresh independent/adversarial confirmation.
  - Do not generalize from one observation unless the normative requirement is itself general.
  - Do not silently widen domain, schema, API, config, service, or authority surfaces when an existing representation
    can preserve the required distinction.
  - Runtime/machine/provider-specific facts belong in the project's established config/secret hierarchy rather than
    scattered hardcoding.
  - Preserve failed evidence and correction history.
  - Capability selection MUST precede detailed provider-skill loading.
  - The project runtime owns one Three.js resolution; no adapter may solve compatibility by creating a second runtime
    object universe.
  - Blender is an escalation route and img2threejs is reference-image reconstruction, not generic asset generation.
  - Provider success, attractive pixels, and green builds are never settlement by themselves.
  claim_states:
  - OBSERVED
  - INFERRED
  - DECIDED
  - ASSUMED
  - UNKNOWN
  correction_protocol:
  - Preserve the failed evidence.
  - 'Classify the failure: implementation, oracle/test, representation, missing prerequisite, environmental confound,
    or source-spec ambiguity.'
  - Determine whether the governing requirement/invariant remains valid.
  - Correct the smallest falsified layer.
  - Rerun the original teeth/falsification check.
  - Rerun the original confirmation path.
  - Append the correction round; do not erase the failed round.
  - Do not weaken acceptance merely because the implementation repeatedly fails it.
  scope_control: A newly discovered issue enters the current plan only when it blocks a normative requirement or
    is itself required by the source specification. Valuable but independent discoveries become future debt/plans.
    Attractive architecture with no requirement is rejected from current scope.
implementation_projection:
  repository_topology:
    shape: pnpm TypeScript monorepo with just facade; games generated as independent repositories/directories
    tree: 'game-studio/

      ├── package.json

      ├── pnpm-workspace.yaml

      ├── justfile

      ├── specs/

      │   └── agentic-threejs-game-studio.spec.yaml

      ├── plans/

      │   └── agentic-threejs-game-studio.plan.yaml

      ├── capabilities/

      │   └── *.yaml

      ├── packages/

      │   ├── contracts/

      │   ├── capabilities/

      │   ├── router/

      │   ├── studio-cli/

      │   ├── asset-registry/

      │   ├── observability/

      │   ├── evidence/

      │   ├── gauntlet-bridge/

      │   └── adapters/

      │       ├── needle-runtime/

      │       ├── koota-state/

      │       ├── img2threejs/

      │       ├── 3dviz/

      │       ├── terrain/

      │       ├── recast/

      │       ├── bvh/

      │       ├── gltf-transform/

      │       ├── polyhaven/

      │       ├── quarks/

      │       ├── tone/

      │       ├── blender/

      │       └── browser/

      ├── skills/

      │   ├── game-studio-director/

      │   └── vendor-overrides/

      ├── vendor/

      │   ├── img2threejs/          # pinned submodule

      │   ├── 3dviz-pro-max/        # pinned submodule

      │   └── threejs-game-skills/  # pinned submodule

      ├── templates/game/

      ├── examples/blackwater-relay/

      ├── scripts/

      ├── .agents/

      │   ├── state/current-status.yaml

      │   ├── decisions/game-studio.jsonl

      │   ├── preregistrations/

      │   └── reports/

      └── artifacts/runs/'
    rules:
    - Normal runtime libraries are package dependencies, not submodules.
    - Only agent-facing upstream repositories needing skill/source inspection begin as submodules.
    - Generated user games live outside the studio monorepo by default.
    - Blackwater Relay remains in-repo solely as conformance/reference integration.
  adapter_kinds:
    agent_skill: The current coding agent loads a routed upstream SKILL.md after capability selection; the studio
      CLI supplies request/result contracts but does not spawn a hidden agent runner.
    package: A TypeScript adapter wraps a normal npm package behind studio contracts.
    cli_dcc: A bounded subprocess adapter invokes an external CLI/DCC with explicit inputs/outputs and evidence.
    http_source: A typed network adapter discovers/downloads external assets under provenance policy.
    browser: Separate exploratory and deterministic proof interfaces.
  exact_adapters:
  - id: adapter.img2threejs
    kind: agent_skill
    binding: vendor/img2threejs/SKILL.md
    capabilities:
    - asset.reconstruct.reference-image
    contract: CapabilityRequest -> routed host-native skill work -> CapabilityResult + AssetRecord; requires suitable
      reference imagery.
  - id: adapter.3dviz
    kind: agent_skill
    binding: vendor/3dviz-pro-max/skills/3dviz-pro-max/SKILL.md
    capabilities:
    - world.environment.compose
    contract: World brief -> skill-authored Three.js scene/world changes + normalized result/evidence.
  - id: adapter.threejs-game-skills
    kind: agent_skill
    binding: selected vendor/threejs-game-skills/skills/*/SKILL.md paths
    capabilities:
    - game.gameplay
    - game.graphics
    - game.ui
    - game.debug
    - game.qa
    contract: Load selected specialist only after studio routing; upstream director is not authoritative.
  - id: adapter.needle-runtime
    kind: package
    binding: Needle Engine + project-owned Three.js resolution
    capabilities:
    - runtime.threejs
    - runtime.physics
    contract: Game projections/lifecycle/physics while Koota remains semantic authority.
  - id: adapter.koota-state
    kind: package
    binding: koota
    capabilities:
    - game.state.ecs
    contract: Authoritative entities/traits/relations/actions with stable projection IDs.
  - id: adapter.recast
    kind: package
    binding: '@recast-navigation/core + @recast-navigation/generators + @recast-navigation/three'
    capabilities:
    - navigation.navmesh
    - navigation.path
    contract: World/navigation geometry -> navmesh/path/crowd outputs.
  - id: adapter.bvh
    kind: package
    binding: three-mesh-bvh
    capabilities:
    - spatial.raycast
    - spatial.query
    contract: Three geometry -> accelerated spatial queries; never owns semantics.
  - id: adapter.terrain
    kind: package
    binding: three.terrain.js
    capabilities:
    - world.terrain.generate
    contract: Seeded terrain specification -> Three geometry + metadata.
  - id: adapter.gltf-transform
    kind: package
    binding: '@gltf-transform/core/functions/extensions/cli'
    capabilities:
    - asset.gltf.normalize
    - asset.gltf.optimize
    contract: GLB/glTF staging asset -> normalized/compressed runtime artifact + metrics.
  - id: adapter.polyhaven
    kind: http_source
    binding: Poly Haven public API
    capabilities:
    - asset.material.source
    - environment.hdri.source
    contract: Search/metadata/download -> staged asset with provenance -> Asset Registry.
  - id: adapter.quarks
    kind: package
    binding: three.quarks
    capabilities:
    - vfx.particles
    contract: Game state/events -> resettable Three.js particle effects.
  - id: adapter.tone
    kind: package
    binding: tone
    capabilities:
    - audio.procedural
    contract: Game state/events -> inspectable procedural audio; imported/generated audio remains separate capability.
  - id: adapter.blender
    kind: cli_dcc
    binding: Blender CLI/Python; Needle Blender handoff when useful
    capabilities:
    - dcc.blender.process
    contract: Escalated DCC request -> derived GLB/textures/animations -> Asset Registry; Blender never owns game
      semantics.
  - id: adapter.browser
    kind: browser
    binding: agent-browser for exploration; Playwright for deterministic proof
    capabilities:
    - browser.explore
    - browser.prove
    contract: Running game + observability bridge -> exploratory artifacts or run-scoped proof artifacts.
  threejs_game_skills_policy:
    source: vendor/threejs-game-skills pinned submodule
    global_discovery: disabled; only game-studio-director is globally/studio-discoverable
    overlay_unchanged:
    - threejs-gameplay-systems
    - threejs-aaa-graphics-builder
    - threejs-game-ui-designer
    - threejs-debug-profiler
    - threejs-qa-release
    replace_not_fork:
      threejs-game-director: Not loaded as director. game-studio-director owns routing, continuity, provider policy,
        and Gauntlet handoff.
    quarantined_optional_fallbacks:
      threejs-3d-generator: Only after studio asset routing concludes no preferred reference/sourced/procedural/Blender
        route and project policy allows generic generation.
      threejs-image-generator: Optional concepts/textures/decals/UI provider; never an automatic substitute for
        a user reference.
      threejs-audio-generator: Optional generated-audio provider after project/user/CC0/procedural/local routes
        as policy allows.
    fork_policy:
      baseline: No fork.
      trigger: A specialist skill hardcodes provider/runtime/evidence semantics that cannot be overridden by adapter/overlay
        while preserving its useful knowledge.
      unit: Fork/copy only the affected skill directory, not the whole repository.
      location: skills/vendor-overrides/threejs-game-skills/<skill>/
      required_metadata: UPSTREAM.yaml with upstream repo, commit, reason, changed files, and rebase test.
  reference_game:
    id: blackwater-relay
    title: Blackwater Relay
    purpose: A small production-shaped third-person browser vertical slice designed to force every foundational
      studio route to coexist and be verified.
    premise: Drive a rover across a storm-dusk island relay outpost, recover a power cell, open the relay gate,
      avoid or observe a patrolling service drone, operate a field transceiver reconstructed from a reference image,
      and activate the beacon.
    required_capability_coverage:
    - '3dviz-pro-max: outpost/world composition, lighting, atmosphere, named views'
    - 'three.terrain.js: seeded island/valley heightfield'
    - 'img2threejs: project-owned reference fixture -> procedural field transceiver'
    - 'Poly Haven/source route: at least one accepted PBR/HDRI asset'
    - 'Needle + Three.js: runtime'
    - 'Koota: authoritative player/objective/inventory/drone state'
    - 'Rapier: rover/world physics and triggers'
    - 'Recast: service-drone patrol/navigation'
    - 'three-mesh-bvh: interaction ray/line-of-sight/spatial validation'
    - 'three.quarks: beacon sparks/dust/activation VFX'
    - 'Tone.js: procedural interaction/beacon/UI audio'
    - 'DOM/CSS: HUD/objective/interaction UI'
    - 'Blender: justified service-drone animation retarget/bake escalation'
    - 'glTF-Transform: imported/derived asset normalization'
    - 'agent-browser: exploratory inspection'
    - 'Playwright + observability + Gauntlet: deterministic state/pixel/telemetry settlement'
    named_scenarios:
    - boot
    - active-play
    - transceiver-interaction
    - patrol-obstacle
    - beacon-activation
    - performance-flythrough
    reference_image_policy: The conformance game uses an original project-owned reference fixture so tests are reproducible;
      real game projects prefer user-supplied images before approved project/licensed references.
    blender_escalation_fixture: A service-drone animation source intentionally requires skeleton retarget/bake;
      Blender solves only that DCC operation and exports a derived GLB.
    quality_profiles: T05 freezes desktop-high and mobile-medium targets from an explicit reference-host baseline
      before game implementation; later failures may not weaken them silently.
artifacts:
  current_status: .agents/state/current-status.yaml
  decision_log: .agents/decisions/game-studio.jsonl
  evidence_root: artifacts/runs
  reports_root: .agents/reports
  preregistration_root: .agents/preregistrations
  status_rule: Mutable current status is an operational projection and MUST NOT become a source of desired-state
    or normative authority.
verification:
  global_gates:
  - id: GATE-CHECK
    command: just check
  - id: GATE-TEST
    command: just test
  - id: GATE-LINT
    command: just lint
  - id: GATE-DOCTOR
    command: just doctor
  gate_binding_rule: T00/T02 create stable just aliases; subsequent tasks extend underlying package/project tests
    but MUST reuse these aliases for whole-repository checks rather than creating parallel top-level command surfaces.
  proof_levels:
    P0: Mechanical/deterministic change. Requires a narrow direct gate plus applicable global gates.
    P1: Normal behavioral work. Requires positive behavior, a meaningful teeth/falsification check, and applicable
      global gates.
    P2: Invariant-sensitive work. Requires an explicit or preregistered claim, meaningful adversarial/negative evidence,
      an evidence artifact, applicable global gates, and review of a plausible alternate failure path.
    P3: Settlement-critical work. Requires frozen preregistration, builder evidence, explicit adversarial attacks,
      fresh independent confirmation, and correction/re-confirmation after any failed confirmation.
