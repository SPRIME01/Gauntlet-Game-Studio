    - Traceability reports 99/99 mapped REQUIRED requirement IDs.
    - No unknown plan IDs.
    - All P3 confirmations are fresh and passing.
    - All global gates pass from clean checkout.
    - Final report claim levels do not exceed evidence.
    - Next action becomes `none — plan settled`.
final_acceptance:
  repository_and_operability:
  - The studio monorepo contains contracts, registry/router, adapters, studio-owned skills, CLI, templates, evidence/Gauntlet
    tooling, and only the declared pinned agent-facing subrepos.
  - A generated game outside the studio checkout builds and runs from its project-local lock/config/dependencies.
  - just is an ergonomic façade and the semantic `studio` CLI is machine-readable and stable.
  routing_and_upstreams:
  - Capability selection precedes provider detail; fixed routing corpus and collision lint pass.
  - img2threejs is selected for specific depicted subjects with suitable reference imagery and rejected as generic
    text-to-3D.
  - 3dviz owns environment composition; terrain, navigation, state, physics, and other providers remain separate
    capabilities.
  - threejs-game-skills specialist knowledge is reused without loading its director or default generators as studio
    authority.
  - No permanent fork exists unless an individual-skill fork trigger is evidenced and documented.
  runtime_and_assets:
  - One authoritative Three.js runtime is proven against representative provider output.
  - Koota game semantics survive render/physics projection rebuilds.
  - Every production asset has acceptable AssetRecord provenance, route, normalization, and budget state.
  - Blender escalation produces derived runtime assets without becoming game authority.
  verification_and_performance:
  - Development/test observability exposes stable semantic, scenario, physics/nav where applicable, error, camera,
    and telemetry reads; privileged mutation is absent/gated in production.
  - Playwright proof is run-scoped and distinguishable from agent-browser exploration.
  - Gauntlet refuses provider-only, screenshot-only, stale, contradictory, and over-budget false success.
  - Blackwater Relay passes frozen desktop/mobile quality profiles on the declared target environment.
  evidence_and_confirmation:
  - Every REQUIRED normative spec requirement maps to at least one settled task/evidence record.
  - Every P3 task has the required fresh independent confirmation.
  - Failed/correction evidence has not been erased.
  - Documentation/status claims do not exceed observed proof.
  - All global gates exit 0.
  - Blackwater Relay and the recovery matrix reproduce from a clean checkout.
  - Final traceability reports 99/99 requirements mapped with zero unknown IDs.
guardrails:
- Do not introduce a second runtime Three.js instance to solve provider compatibility.
- Do not make render, Rapier, Recast, Blender, or provider objects authoritative game semantics.
- Do not globally install all vendor skills; use progressive disclosure after capability routing.
- Do not route no-reference generic assets to img2threejs.
- Do not use Blender as default authoring when a simpler accepted representation can settle the requirement.
- Do not silently fallback to a semantically different provider or lower quality bar.
- Do not accept production assets without provenance and applicable budget/normalization gates.
- Do not allow exploratory browser artifacts or historical captures to masquerade as current deterministic proof.
- Do not overwrite failed evidence or correction history.
- Unity integration remains out of scope.
handoff_contract:
  must_report:
  - settled capabilities/requirements
  - explicitly unsettled or deferred items
  - current operational system state
  - requirement-to-evidence index
  - known limitations
  - rollback/recovery instructions where relevant
  - important decisions/discoveries that changed the execution model
  - exact next executable action or 'none — plan settled'
  settled_next_action_rule: The next executable action MUST be set to `none — plan settled` only after the final
    required conformance/confirmation task succeeds.
